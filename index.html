    <div class="modal-head"><h3>${editing?'Redigera':'Ny'} utbildningsmodul</h3><button class="modal-close" onclick="closeModal()">✕</button></div>
    <div class="modal-body">
      <div class="grid2">

function saveModul(id){

  else DB.utbildningModuler.push({id:uid('m'), ...data, prov:null});

function openSkapaProv(mid){

}
function renderSkapaProvModal(mid){

  const prov = m.prov;
  openModal(`
    <div class="modal-head"><div><h3>Skapa prov</h3><div class="sub">${escapeHtml(m.namn)}</div></div><button class="modal-close" onclick="closeModal()">✕</button></div>
    <div class="modal-body">
      <div class="grid2">
        <div class="field"><span class="label">Godkäntgräns (%)</span><input type="number" id="provGrans" value="${prov.godkantGrans}"></div>
        <div class="field"><span class="label">Max antal försök</span><input type="number" id="provForsok" value="${prov.maxForsok}"></div>
      </div>
      <button class="btn btn-primary btn-sm" onclick="saveProvInst('${mid}')">Spara provinställningar</button>

      <div style="margin-top:20px;"><span class="label">Befintliga frågor</span></div>
      ${prov.fragor.length===0? `<div class="hint">Inga frågor tillagda ännu.</div>` : prov.fragor.map((f,i)=>`
        <div class="card pad" style="margin-bottom:8px;display:flex;justify-content:space-between;align-items:center;">
          <div><span class="badge badge-blue" style="margin-right:8px;">${i+1}</span><b>${escapeHtml(f.text)}</b><div class="hint">${escapeHtml(f.typ)} · ${f.poang} poäng · Rätt: ${escapeHtml(f.ratt)}</div></div>

        <span class="label">Lägg till fråga</span>

          <select id="fqTyp" onchange="renderFqAlt(this.value)">
            <option value="Flerval">Flerval (A/B/C/D)</option>
            <option value="Sant/Falskt">Sant/Falskt</option>
            <option value="Fritext">Fritext</option>
          </select>
        </div>
        <div class="field"><span class="label">Frågetext</span><textarea id="fqText" rows="2" placeholder="Skriv frågan här..."></textarea></div>
        <div id="fqAltWrap"></div>
        <div class="field"><span class="label">Poäng för frågan</span><input type="number" id="fqPoang" value="1"></div>

function renderFqAlt(typ){

  if(typ==='Flerval'){
    wrap.innerHTML = `
      <span class="label">Svarsalternativ</span>
      ${['A','B','C','D'].map(l=>`<div class="field" style="display:flex;gap:8px;align-items:center;"><b style="width:14px;">${l}</b><input type="text" id="fqAlt${l}" placeholder="Alternativ ${l}${l==='C'||l==='D'?' (valfritt)':''}"></div>`).join('')}
      <div class="field"><span class="label">Rätt svar</span><select id="fqRatt"><option>A</option><option>B</option><option>C</option><option>D</option></select></div>
    `;
  } else if(typ==='Sant/Falskt'){
    wrap.innerHTML = `<div class="field"><span class="label">Rätt svar</span><select id="fqRatt"><option>Sant</option><option>Falskt</option></select></div>`;
  } else {
    wrap.innerHTML = `<div class="hint" style="margin-bottom:10px;">Fritextsvar rättas manuellt av admin/utbildare efter inlämning.</div><input type="hidden" id="fqRatt" value="">`;
  }
}
function saveProvInst(mid){
  const m = DB.utbildningModuler.find(x=>x.id===mid);
  m.prov.godkantGrans = +document.getElementById('provGrans').value||70;
  m.prov.maxForsok = +document.getElementById('provForsok').value||3;
  saveDB(); toast('Provinställningar sparade');
}
function addFraga(mid){
  const m = DB.utbildningModuler.find(x=>x.id===mid);
  const typ = document.getElementById('fqTyp').value;
  const text = document.getElementById('fqText').value.trim();
  if(!text){ toast('Skriv en frågetext'); return; }
  const poang = +document.getElementById('fqPoang').value||1;
  const ratt = document.getElementById('fqRatt').value;
  let alt = null;
  if(typ==='Flerval') alt = {A:document.getElementById('fqAltA').value,B:document.getElementById('fqAltB').value,C:document.getElementById('fqAltC').value,D:document.getElementById('fqAltD').value};
  m.prov.fragor.push({id:uid('q'), typ, text, poang, alt, ratt});
  saveDB(); renderSkapaProvModal(mid); toast('Fråga tillagd');
}
function delFraga(mid, qid){
  const m = DB.utbildningModuler.find(x=>x.id===mid);
  m.prov.fragor = m.prov.fragor.filter(f=>f.id!==qid);
  saveDB(); renderSkapaProvModal(mid);
}

function requestExam(mid){
  const me = currentUser();
  let prog = me.utbildningar.find(u=>u.modulId===mid);
  if(!prog){ prog = {modulId:mid, steg:{}, provStatus:'none', resultat:null, notering:''}; me.utbildningar.push(prog); }
  prog.provStatus = 'vantande';
  const m = DB.utbildningModuler.find(x=>x.id===mid);
  DB.notiser.push({id:uid('n'), typ:'provfraga', titel:'Provförfrågan: '+m.namn,
    text:me.namn+' vill göra provet "'+m.namn+'". Godkänn eller neka nedan.',
    datum:new Date().toISOString(), lest:false, modulId:mid, personId:me.id, status:'ny'});
  saveDB(); renderPage(); renderTopbar(); toast('Förfrågan skickad till admin');
}
function openTaProv(mid){
  window.__quizState = {mid, idx:0, svar:{}};
  renderQuizModal();
}
function renderQuizModal(){
  const {mid, idx} = window.__quizState;
  const m = DB.utbildningModuler.find(x=>x.id===mid);
  const q = m.prov.fragor[idx];
  const total = m.prov.fragor.length;
  if(!q){ return finishQuiz(); }
  let answerHtml = '';
  if(q.typ==='Flerval'){
    answerHtml = Object.entries(q.alt).filter(([k,v])=>v).map(([k,v])=>`
      <label style="display:flex;gap:8px;align-items:center;padding:9px 12px;border:1px solid var(--border);border-radius:7px;margin-bottom:7px;cursor:pointer;">
        <input type="radio" name="quizAns" value="${k}" ${window.__quizState.svar[q.id]===k?'checked':''} onchange="window.__quizState.svar['${q.id}']='${k}'"><b>${k}</b> ${escapeHtml(v)}
      </label>`).join('');
  } else if(q.typ==='Sant/Falskt'){
    answerHtml = ['Sant','Falskt'].map(v=>`
      <label style="display:flex;gap:8px;align-items:center;padding:9px 12px;border:1px solid var(--border);border-radius:7px;margin-bottom:7px;cursor:pointer;">
        <input type="radio" name="quizAns" value="${v}" ${window.__quizState.svar[q.id]===v?'checked':''} onchange="window.__quizState.svar['${q.id}']='${v}'"> ${v}
      </label>`).join('');
  } else {
    answerHtml = `<textarea rows="4" placeholder="Skriv ditt svar här..." oninput="window.__quizState.svar['${q.id}']=this.value">${window.__quizState.svar[q.id]||''}</textarea>
      <div class="hint">Fritext — rättas manuellt av utbildare.</div>`;
  }
  openModal(`
    <div class="modal-head"><h3>${escapeHtml(m.namn)}</h3><button class="modal-close" onclick="closeModal()">✕</button></div>
    <div class="modal-body">
      <div style="display:flex;justify-content:space-between;font-size:12px;color:var(--muted);"><span>Fråga ${idx+1} av ${total}</span><span>${q.poang} poäng</span></div>
      <div class="quiz-progbar"><div style="width:${((idx+1)/total*100).toFixed(0)}%"></div></div>
      <b style="display:block;margin-bottom:12px;">${escapeHtml(q.text)}</b>
      ${answerHtml}
    </div>
    <div class="modal-foot">
      <button class="btn" ${idx===0?'disabled':''} onclick="window.__quizState.idx--;renderQuizModal();">← Föregående</button>
      ${idx<total-1? `<button class="btn btn-primary" onclick="window.__quizState.idx++;renderQuizModal();">Nästa →</button>`
        : `<button class="btn btn-green" onclick="finishQuiz();">Lämna in ✓</button>`}
    </div>
  `);
}
function finishQuiz(){
  const {mid, svar} = window.__quizState;
  const m = DB.utbildningModuler.find(x=>x.id===mid);
  let poang=0, maxPoang=0, hasFritext=false;
  const fritextsvar = [];
  m.prov.fragor.forEach(q=>{
    maxPoang += q.poang;
    if(q.typ==='Fritext'){ hasFritext=true; fritextsvar.push({fraga:q.text, svar:svar[q.id]||''}); return; }
    if(svar[q.id]===q.ratt) poang += q.poang;
  });
  const pct = maxPoang? Math.round(poang/maxPoang*100):0;
  const godkand = pct >= m.prov.godkantGrans;
  const me = currentUser();
  const prog = me.utbildningar.find(u=>u.modulId===mid);
  prog.resultat = {poang, maxPoang, pct, godkand, hasFritext, fritextsvar, rattat:!hasFritext, datum:new Date().toISOString()};
  prog.provStatus = 'genomfort';
  const lastStepIdx = m.steg.length-1;
  if(godkand && !hasFritext) prog.steg[lastStepIdx] = true;
  saveDB();
  closeModal();
  renderPage();
  toast(hasFritext? 'Prov inlämnat — väntar på manuell rättning' : (godkand? `Godkänt! ${pct}%` : `Ej godkänt (${pct}%)`));
}

  return `

    <div class="card pad">
      ${rows.length===0 ? `<div class="empty"><div class="big">📝</div><b>Inga genomförda prov ännu</b>Genomförda prov dyker upp här för rättning och uppföljning.</div>` :
        rows.map(({p,m,u})=>`
          <div class="list-row">

function rattaProv(pid, mid, godkand){
  if(!requireUtbildare()) return;
  const p = DB.personal.find(x=>x.id===pid); if(!p) return;
  const u = p.utbildningar.find(x=>x.modulId===mid); if(!u || !u.resultat) return;
  const kommentar = (prompt('Valfri kommentar till '+p.namn+' ('+(godkand?'godkänt':'ej godkänt')+', kan lämnas tomt):','')||'').trim();
  u.resultat.godkand = godkand;
  u.resultat.rattat = true;
  if(kommentar) u.notering = kommentar;
  const m = DB.utbildningModuler.find(x=>x.id===mid);
  if(godkand && m){ const lastStepIdx = m.steg.length-1; u.steg[lastStepIdx] = true; }
  DB.notiser.push({id:uid('n'), typ:'provrattat', till:p.id,
    titel:(godkand?'Godkänt: ':'Ej godkänt: ')+(m?m.namn:'prov'),
    text:(godkand? 'Ditt prov har rättats och är godkänt.' : 'Ditt prov har rättats och är inte godkänt.')+(kommentar? ' Kommentar från utbildare: '+kommentar : ''),
    datum:new Date().toISOString(), lest:false});
  saveDB(); renderPage(); renderTopbar(); toast(godkand? 'Prov godkänt' : 'Prov underkänt');
}

function bytProfilbild(){
  const input = document.createElement('input');
  input.type = 'file'; input.accept = 'image/*';
  input.onchange = ()=>{
    const file = input.files[0]; if(!file) return;
    if(file.size > 5*1024*1024){ toast('Bilden är för stor (max 5 MB)'); return; }
    const reader = new FileReader();
    reader.onload = ()=>{
      const img = new Image();
      img.onload = ()=>{
        const size = 160;
        const canvas = document.createElement('canvas');
        canvas.width = size; canvas.height = size;
        const ctx = canvas.getContext('2d');
        const scale = Math.max(size/img.width, size/img.height);
        const w = img.width*scale, h = img.height*scale;
        ctx.drawImage(img, (size-w)/2, (size-h)/2, w, h);
        currentUser().profilbild = canvas.toDataURL('image/jpeg', 0.82);
        saveDB(); renderTopHeader(); renderPage();
        toast('Profilbild uppdaterad');
      };
      img.src = reader.result;
    };
    reader.readAsDataURL(file);
  };
  input.click();
}
function taBortProfilbild(){
  currentUser().profilbild = null;
  saveDB(); renderTopHeader(); renderPage(); toast('Profilbild borttagen');
}
function sparaKontakt(){
  const tel = document.getElementById('mittTelefon').value.trim();
  if(tel && !/^[0-9+\-\s()]{6,20}$/.test(tel)){ toast('Ange endast ett telefonnummer (siffror, mellanslag, + eller -).'); return; }
  currentUser().telefon = tel;
  saveDB(); toast('Kontaktuppgifter sparade');
}

function toggleKontoAdmin(k){
  const nu = !!DB.kontoAdmin[k];
  if(nu){
    const antalAdmin = DB.inloggadeKonton.filter(x=>DB.kontoAdmin[x]).length;
    if(antalAdmin<=1){ toast('Minst ett konto måste ha adminbehörighet'); return; }
  }
  DB.kontoAdmin[k] = !nu;
  saveDB(); renderPage(); toast(nu? 'Adminbehörighet borttagen' : 'Adminbehörighet tillagd');
}
function addAnvandare(){
  const namn = prompt('Kontonamn (ex: förnamn.efternamn):'); if(!namn) return;
  if(DB.inloggadeKonton.includes(namn)){ toast('Kontot finns redan'); return; }
  const pass = prompt('Lösenord för kontot (kan lämnas tomt):','') || '';
  const admin = confirm('Ska kontot ha adminbehörighet?');
  DB.inloggadeKonton.push(namn); DB.losenord[namn] = pass; DB.kontoAdmin[namn] = admin;
  saveDB(); renderPage(); toast('Konto skapat');
}
function godkannKonto(vid){
  if(!requireAdmin()) return;
  const v = DB.vantandeKonton.find(x=>x.id===vid); if(!v) return;
  DB.inloggadeKonton.push(v.konto);
  DB.losenord[v.konto] = v.losenord;
  DB.kontoAdmin[v.konto] = false;
  if(v.personId){ const p = DB.personal.find(x=>x.id===v.personId); if(p) p.kopplatKonto = v.konto; }
  DB.vantandeKonton = DB.vantandeKonton.filter(x=>x.id!==vid);
  DB.notiser.forEach(n=>{ if(n.vantandeId===vid) n.status='hanterad'; });
  saveDB(); renderPage(); toast('Konto godkänt: '+v.konto);
}
function nekaKonto(vid){
  if(!requireAdmin()) return;
  const v = DB.vantandeKonton.find(x=>x.id===vid); if(!v) return;
  if(!confirm('Neka kontoansökan för "'+v.konto+'"?')) return;
  DB.vantandeKonton = DB.vantandeKonton.filter(x=>x.id!==vid);
  DB.notiser.forEach(n=>{ if(n.vantandeId===vid) n.status='hanterad'; });
  saveDB(); renderPage(); toast('Kontoansökan nekad');
}
function resetLosenord(k){
  const nytt = prompt('Nytt lösenord för '+k+':', ''); if(nytt===null) return;
  DB.losenord[k] = nytt; saveDB(); toast('Lösenord uppdaterat för '+k);
}
function delAnvandare(k){
  if(DB.kontoAdmin[k]){
    const antalAdmin = DB.inloggadeKonton.filter(x=>DB.kontoAdmin[x]).length;
    if(antalAdmin<=1){ toast('Kan inte ta bort det enda adminkontot'); return; }
  }
  if(!confirm('Ta bort kontot '+k+'?')) return;
  DB.inloggadeKonton = DB.inloggadeKonton.filter(x=>x!==k);
  delete DB.losenord[k];
  delete DB.kontoAdmin[k];
  DB.personal.forEach(p=>{ if(p.kopplatKonto===k) p.kopplatKonto=''; });
  saveDB(); renderPage();
}

  if(inskickadeKategori==='Alla') list = [...skador, ...sbars, ...journaler, ...akutjournaler];
  else if(inskickadeKategori==='Skaderapporter') list = skador;
  else if(inskickadeKategori==='SBAR') list = sbars;
  else if(inskickadeKategori==='Journal') list = journaler;
  else if(inskickadeKategori==='Akutjournal') list = akutjournaler;
  if(inskickadeKategori==='Skaderapporter' && inskickadeStatusFilter!=='Alla') list = list.filter(f=>f.status===inskickadeStatusFilter);
  list = list.slice().sort((a,b)=> (b.datum||'').localeCompare(a.datum||''));
  const kategoriAntal = {Skaderapporter:skador.length, SBAR:sbars.length, Journal:journaler.length, Akutjournal:akutjournaler.length};

  return `
    <div class="page-head"><div><h1 class="page-title">Inskickade formulär</h1><p class="page-sub">Alla inlämnade formulär från personalen</p></div></div>
    <div class="tabbar">
      ${['Alla','Skaderapporter','SBAR','Journal','Akutjournal'].map(k=>`<div class="tab ${inskickadeKategori===k?'active':''}" onclick="inskickadeKategori='${k}';renderPage();">${k}${k==='Alla'?'':' ('+kategoriAntal[k]+')'}</div>`).join('')}
    </div>
    ${inskickadeKategori==='Skaderapporter' ? `
    <div class="tabbar">${['Inkomna','Pågående','Avslutade','Alla'].map(s=>`<div class="tab ${inskickadeStatusFilter===(s==='Inkomna'?'Inkommen':s)?'active':''}" onclick="inskickadeStatusFilter='${s==='Inkomna'?'Inkommen':s}';renderPage();">${s}</div>`).join('')}</div>
    ` : ''}
    <div class="card">
      ${list.length===0 ? `<div class="empty">Inga formulär matchar filtret.</div>` :
        list.map(f=>{
          if(f.__typ==='skada'){
            const v = DB.fordon.find(x=>x.id===f.fordonId);
            return `<div class="list-row" style="display:flex;justify-content:space-between;align-items:center;padding:14px 16px;">
              <div>
                <span class="badge badge-amber" style="margin-right:8px;">Skaderapport</span>
                <b>${v?escapeHtml(v.kod)+' — '+escapeHtml(v.typ)+' ('+escapeHtml(v.station)+')':'Okänt fordon'}</b> <span style="color:var(--muted);">av ${escapeHtml(f.av)}</span>
                <div style="font-size:11.5px;color:var(--muted);margin-top:2px;">${f.datum} · ${escapeHtml(f.plats)}</div>
                <div style="font-size:12px;margin-top:2px;">${escapeHtml(f.typAvSkada)}</div>
              </div>
              <div style="display:flex;gap:8px;align-items:center;">
                <span class="badge ${f.status==='Inkommen'?'badge-amber':f.status==='Avslutad'?'badge-green':'badge-blue'}">${escapeHtml(f.status)}</span>
                <button class="btn btn-primary btn-sm" onclick="openHanteraFormular('${f.id}')">Hantera</button>
                <button class="btn btn-danger btn-sm" onclick="delFormular('${f.id}')">Ta bort</button>
              </div>
            </div>`;
          }
          if(f.__typ==='sbar'){
            return `<div class="list-row" style="display:flex;justify-content:space-between;align-items:center;padding:14px 16px;">
              <div>
                <span class="badge badge-blue" style="margin-right:8px;">SBAR</span>
                <b>${escapeHtml(f.patient||'Okänd patient')}</b> <span style="color:var(--muted);">av ${escapeHtml(f.av)}</span>
                <div style="font-size:11.5px;color:var(--muted);margin-top:2px;">${new Date(f.datum).toLocaleString('sv-SE')} · ${escapeHtml(fordonLabel(f.s&&f.s.fordonId))}</div>
              </div>

                <button class="btn btn-danger btn-sm" onclick="delSBAR('${f.id}')">Ta bort</button>
              </div>
            </div>`;
          }
          if(f.__typ==='journal'){
          return `<div class="list-row" style="display:flex;justify-content:space-between;align-items:center;padding:14px 16px;">
            <div>
              <span class="badge badge-green" style="margin-right:8px;">Journal</span>
              <b>${escapeHtml(f.patient && f.patient.pnr ? f.patient.pnr : 'Patient ej angiven')}</b> <span style="color:var(--muted);">av ${escapeHtml(f.av)}</span>
              <div style="font-size:11.5px;color:var(--muted);margin-top:2px;">${f.datumUppdrag||''} · ${escapeHtml(f.ort||'')} · ${escapeHtml(fordonLabel(f.fordonId))}</div>
            </div>

              <span class="badge ${f.patient&&f.patient.retts==='Röd'?'badge-red':f.patient&&f.patient.retts==='Orange'?'badge-amber':'badge-gray'}">${escapeHtml((f.patient&&f.patient.retts)||'')}</span>
              <button class="btn btn-primary btn-sm" onclick="openHanteraJournal('${f.id}')">Visa</button>
              <button class="btn btn-danger btn-sm" onclick="delJournal('${f.id}')">Ta bort</button>
            </div>
          </div>`;
          }
          return `<div class="list-row" style="display:flex;justify-content:space-between;align-items:center;padding:14px 16px;">
            <div>
              <span class="badge badge-blue" style="margin-right:8px;">Akutjournal</span>
              <b>${escapeHtml(f.klinik||'Klinik ej angiven')}${f.rumPlats? ' — '+escapeHtml(f.rumPlats):''}</b> <span style="color:var(--muted);">av ${escapeHtml(f.av)}</span>
              <div style="font-size:11.5px;color:var(--muted);margin-top:2px;">${f.ankomstDatum||''} ${f.ankomstKl||''}</div>
            </div>
            <div style="display:flex;gap:8px;align-items:center;">

            </div>

    </div>
  `;

const SESSION_KEY = 'ambulansintranat_session_v1';
let SESSION = {konto:null};
let loginMode = 'valj'; // 'valj' | 'nytt'
let loginSelected = null;
let loginError = '';
let loginInfo = '';

function loadSession(){
  try{
    const raw = sessionStorage.getItem(SESSION_KEY);
    SESSION = raw ? JSON.parse(raw) : {konto:null};
  }catch(e){ SESSION = {konto:null}; }
}
function saveSession(){ sessionStorage.setItem(SESSION_KEY, JSON.stringify(SESSION)); }

const THEME_KEY = 'ambulansintranat_theme';
let theme = localStorage.getItem(THEME_KEY) || 'light';
function applyTheme(){ document.body.classList.toggle('dark-theme', theme==='dark'); }
function setTheme(t){ theme = t; localStorage.setItem(THEME_KEY, t); applyTheme(); if(CURRENT_PAGE==='mitt-konto') renderPage(); }

function initApp(){
  applyTheme();
  loadLocalDB(); // snabb lokal start (fungerar även offline)
  loadSession();
  initCloud(()=>{
    if(SESSION.konto && DB.inloggadeKonton.includes(SESSION.konto)){
      afterLogin();
    } else {
      showLogin();
    }
  });
}

function showLogin(){
  document.getElementById('shell').style.display = 'none';
  const ls = document.getElementById('login-screen');
  ls.style.display = 'flex';
  loginMode = 'valj'; loginSelected = null; loginError = ''; loginInfo = '';
  renderLoginScreen();
}
function renderLoginScreen(){
  const ls = document.getElementById('login-screen');
  ls.innerHTML = `
    <div>
      <div class="login-wrap">
        <div class="login-card">
          <div class="login-body">
            <img class="brand-logo" src="${LOGO_VGR}" alt="Region Västra Götaland">
            <h3>Välkommen tillbaka</h3>
            <p class="sub">Logga in med ditt användarnamn och lösenord</p>
            ${loginError? `<div class="login-error">${escapeHtml(loginError)}</div>`:''}
            ${loginInfo? `<div class="login-info">${escapeHtml(loginInfo)}</div>`:''}
            ${loginMode==='valj' ? `
              <div class="field"><span class="label">Användarnamn</span><input type="text" id="loginUser" placeholder="förnamn.efternamn" autocomplete="username" onkeydown="if(event.key==='Enter') document.getElementById('loginPass').focus();"></div>
              <div class="field"><span class="label">Lösenord</span><input type="password" id="loginPass" placeholder="••••••" autocomplete="current-password" onkeydown="if(event.key==='Enter') doLogin();"></div>
              <button class="btn btn-primary" style="width:100%;justify-content:center;" onclick="doLogin()">Logga in</button>
              <span class="login-toggle" onclick="loginMode='nytt';loginError='';loginInfo='';renderLoginScreen();">+ Skapa nytt konto</span>
            ` : `
              <span class="label">Kontonamn</span>
              <div class="field"><input type="text" id="newKontoNamn" placeholder="ex: förnamn.efternamn"></div>
              <span class="label">Lösenord</span>
              <div class="field"><input type="password" id="newKontoLosen" placeholder="Välj ett lösenord"></div>
              <span class="label">Koppla till personal (valfritt)</span>
              <div class="field">
                <select id="newKontoPerson">
                  <option value="">— Inte kopplat —</option>
                  ${DB.personal.filter(p=>!p.kopplatKonto).map(p=>`<option value="${p.id}">${escapeHtml(p.namn)}</option>`).join('')}
                </select>
              </div>
              <button class="btn btn-primary" style="width:100%;justify-content:center;" onclick="doCreateAccount()">Skapa konto och logga in</button>
              <span class="login-toggle" onclick="loginMode='valj';loginError='';loginInfo='';renderLoginScreen();">← Tillbaka</span>
            `}
          </div>
        </div>
      </div>
      <div class="login-footlink">
        <a href="#" onclick="if(confirm('Rensa all sparad data och börja om från grunden? Detta går inte att ångra.')){resetAllData();} return false;">Problem att logga in? Rensa data och börja om</a>
      </div>
    </div>
  `;
}
function resetAllData(){
  localStorage.removeItem(STORE_KEY);
  sessionStorage.removeItem(SESSION_KEY);
  SESSION = {konto:null};
  if(cloudEnabled && cloudBinId){
    fetch(JSONBIN_BASE+'/'+cloudBinId+'/latest', { headers: jsonbinHeaders() })
      .then(res=>{ if(!res.ok) throw new Error('HTTP '+res.status); return res.json(); })
      .then(data=>{ DB = data.record; migrateDB(); lastCloudJson = JSON.stringify(DB); showLogin(); })
      .catch(()=>{ loadLocalDB(); showLogin(); });
  } else {
    loadLocalDB();
    showLogin();
  }
  toast('Lokal inloggningsdata rensad');
}
function doLogin(){
  const user = ((document.getElementById('loginUser')||{}).value||'').trim();
  const pass = (document.getElementById('loginPass')||{}).value || '';
  if(!user){ loginError='Ange användarnamn.'; renderLoginScreen(); return; }
  if(DB.vantandeKonton.some(v=>v.konto===user)){ loginError='Kontot väntar fortfarande på godkännande från en administratör.'; renderLoginScreen(); return; }
  if(!DB.inloggadeKonton.includes(user)){ loginError='Fel användarnamn eller lösenord.'; renderLoginScreen(); return; }
  const correct = (DB.losenord||{})[user];
  if(correct!==undefined && correct!=='' && pass!==correct){ loginError='Fel användarnamn eller lösenord.'; renderLoginScreen(); return; }
  SESSION = {konto:user}; saveSession();
  afterLogin();
}
function doCreateAccount(){
  const namn = (document.getElementById('newKontoNamn').value||'').trim();
  const pass = document.getElementById('newKontoLosen').value||'';
  const personId = document.getElementById('newKontoPerson').value;
  if(!namn){ loginError='Ange ett kontonamn.'; renderLoginScreen(); return; }
  if(DB.inloggadeKonton.includes(namn) || DB.vantandeKonton.some(v=>v.konto===namn)){ loginError='Kontot finns redan, eller väntar redan på godkännande.'; renderLoginScreen(); return; }
  const blirForstaKonto = DB.inloggadeKonton.length===0 && DB.vantandeKonton.length===0;
  if(blirForstaKonto){
    // Första kontot som någonsin skapas aktiveras direkt och blir admin — annars finns ingen som kan godkänna det.
    DB.inloggadeKonton.push(namn);
    DB.losenord[namn] = pass;
    DB.kontoAdmin[namn] = true;
    if(personId){ const p = DB.personal.find(x=>x.id===personId); if(p) p.kopplatKonto = namn; }
    saveDB();
    SESSION = {konto:namn}; saveSession();
    afterLogin();
    return;
  }
  const vid = uid('vk');
  DB.vantandeKonton.push({id:vid, konto:namn, losenord:pass, personId, datum:new Date().toISOString()});
  DB.notiser.push({id:uid('n'), typ:'kontoansokan', titel:'Ny kontoansökan: '+namn,
    text:'"'+namn+'" har begärt ett konto och väntar på godkännande.',
    datum:new Date().toISOString(), lest:false, vantandeId:vid, status:'ny'});
  saveDB();
  loginMode='valj'; loginError=''; loginInfo='Ditt konto har skickats in och väntar på godkännande från en administratör. Du kan logga in när det är godkänt.';
  renderLoginScreen();
}
function afterLogin(){
  document.getElementById('login-screen').style.display = 'none';
  document.getElementById('shell').style.display = 'flex';
  const p = DB.personal.find(x=>x.kopplatKonto===SESSION.konto);
  DB.currentUserId = p ? p.id : (DB.personal[0] ? DB.personal[0].id : null);
  saveDB();
  route('hem');
}
function logout(){
  SESSION = {konto:null}; saveSession();
  showLogin();
}

/* ================= INIT ================= */
initApp();
</script>
</body>
</html>
