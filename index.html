<!DOCTYPE html>
<html lang="sv">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Ambulansintranät</title>
<style>
  :root{
    --navy:#0a4a75;
    --navy-2:#0d5a8c;
    --navy-3:#125fa0;
    --sb-text:#5b7186;
    --sb-text-active:#083a5c;
    --accent:#0182C3;
    --accent-2:#00AB77;
    --accent-dark:#045f8c;
    --bg:#eef2f6;
    --card:#ffffff;
    --border:#dbe2ea;
    --text:#152531;
    --muted:#5b6b7d;
    --green:#00AB77;
    --green-bg:#e2f6ee;
    --red:#c0272d;
    --red-bg:#fdecec;
    --amber:#8a5a00;
    --amber-bg:#fdf3de;
    --radius:6px;
    --shadow-sm: 0 1px 2px rgba(10,40,60,.06);
    --shadow-md: 0 2px 10px rgba(10,40,60,.10);
    --mono: 'SFMono-Regular', Consolas, 'Liberation Mono', Menlo, monospace;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;height:100%;}
  body{
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
    background:var(--bg);
    color:var(--text);
    font-size:14px;
    line-height:1.45;
    -webkit-font-smoothing:antialiased;
  }
  a{color:inherit;text-decoration:none;}
  button{font-family:inherit;cursor:pointer;transition:background .12s ease, border-color .12s ease, opacity .12s ease, transform .08s ease;}
  input,select,textarea{font-family:inherit;font-size:14px;transition:border-color .12s ease, box-shadow .12s ease;}

  /* ---------- Layout ---------- */
  #topheader{
    background:var(--accent);color:#fff;
    display:flex;align-items:center;justify-content:space-between;
    padding:0 22px;height:56px;flex-shrink:0;
    position:sticky;top:0;z-index:20;
  }
  .th-left{display:flex;align-items:center;gap:12px;min-width:0;}
  .th-vgr-logo{height:30px;filter:brightness(0) invert(1);opacity:1;flex-shrink:0;}
  .th-divider{width:1px;height:28px;background:rgba(255,255,255,.3);flex-shrink:0;}
  .th-icon{width:24px;height:24px;flex-shrink:0;display:flex;align-items:center;justify-content:center;}
  .th-icon img{width:100%;height:100%;object-fit:contain;}
  .th-title{display:flex;flex-direction:column;line-height:1.15;min-width:0;}
  .th-title b{font-family:Georgia,'Times New Roman',serif;font-size:14.5px;font-weight:700;white-space:nowrap;}
  .th-title span{font-size:10px;letter-spacing:.07em;text-transform:uppercase;color:rgba(255,255,255,.8);}
  .th-right{display:flex;align-items:center;gap:16px;position:relative;flex-shrink:0;}
  .th-clock{font-family:var(--mono);font-size:12.5px;color:rgba(255,255,255,.85);}
  .th-bell{position:relative;cursor:pointer;font-size:16px;color:#fff;opacity:.9;}
  .th-bell:hover{opacity:1;}
  .th-bell .badge{position:absolute;top:-6px;right:-8px;background:#fff;color:var(--red);font-size:9px;font-weight:800;border-radius:50%;width:15px;height:15px;display:flex;align-items:center;justify-content:center;}
  .th-user{display:flex;align-items:center;gap:8px;padding-left:14px;border-left:1px solid rgba(255,255,255,.25);}
  .th-user b{font-size:12.5px;display:block;}
  .th-user span{font-size:10px;color:rgba(255,255,255,.75);}
  .th-logout{cursor:pointer;color:rgba(255,255,255,.8);font-size:14px;}
  .th-logout:hover{color:#fff;}

  #app{display:flex;flex:1;min-height:0;}

  #sidebar{
    width:224px;flex-shrink:0;background:#ffffff;
    display:flex;flex-direction:column;color:var(--sb-text);
    position:sticky;top:56px;height:calc(100vh - 56px);overflow-y:auto;
    border-right:1px solid var(--border);
  }
  .sb-status{padding:11px 18px;font-size:11px;display:flex;align-items:center;gap:6px;color:#0a8a5c;border-bottom:1px solid var(--border);}
  .dot{width:6px;height:6px;border-radius:50%;background:#00AB77;display:inline-block;}

  .sb-group-label{font-family:Georgia,'Times New Roman',serif;font-size:10.5px;letter-spacing:.06em;color:#8a97a8;text-transform:uppercase;padding:16px 18px 6px;font-weight:700;}
  .sb-link{display:flex;align-items:center;gap:9px;margin:1px 8px;padding:8px 10px;border-radius:4px;font-size:13px;color:#37485a;cursor:pointer;border-left:3px solid transparent;}
  .sb-link .sbi{width:16px;text-align:center;flex-shrink:0;opacity:.75;font-size:12px;}
  .sb-link:hover{background:#f0f5f9;color:var(--text);}
  .sb-link.active{background:#e5f1fa;color:var(--accent-dark);font-weight:700;border-left-color:var(--accent);}
  .sb-link.active .sbi{opacity:1;}
  .sb-foot{margin-top:auto;padding:14px 18px;font-size:10px;color:#9aa7b8;line-height:1.5;border-top:1px solid var(--border);}

  #main{flex:1;min-width:0;display:flex;flex-direction:column;}
  #topbar{
    background:#fff;border-bottom:1px solid var(--border);
    padding:11px 28px;display:flex;align-items:center;justify-content:space-between;
    position:sticky;top:56px;z-index:10;
  }
  .crumbs{font-size:12.5px;color:var(--muted);}
  .crumbs b{color:var(--text);font-weight:600;}
  .top-right{display:flex;align-items:center;gap:18px;position:relative;}
  .clock{font-family:var(--mono);font-size:13px;color:var(--muted);}
  .bell{position:relative;cursor:pointer;font-size:17px;color:var(--muted);}
  .bell:hover{color:var(--text);}
  .bell .badge{position:absolute;top:-6px;right:-8px;background:var(--red);color:#fff;font-size:9px;border-radius:50%;width:15px;height:15px;display:flex;align-items:center;justify-content:center;}

  #content{padding:26px 28px;flex:1;max-width:1280px;}
  .page-title{font-family:Georgia,'Times New Roman',serif;font-size:23px;font-weight:700;margin:0 0 3px;letter-spacing:0;color:var(--text);}
  .page-sub{font-size:12.5px;color:var(--muted);margin:0 0 18px;}
  .page-head{display:flex;align-items:flex-start;justify-content:space-between;margin-bottom:20px;flex-wrap:wrap;gap:10px;}

  .app-footer{margin-top:36px;padding-top:20px;border-top:1px solid var(--border);display:flex;align-items:center;gap:16px;}
  .app-footer img{height:34px;width:auto;flex-shrink:0;opacity:.85;}
  .app-footer .af-text{display:flex;flex-direction:column;line-height:1.4;}
  .app-footer .af-text b{font-family:Georgia,'Times New Roman',serif;font-size:12.5px;color:var(--text);}
  .app-footer .af-text span{font-size:11px;color:var(--muted);}

  /* ---------- Common components ---------- */
  .card{background:var(--card);border:1px solid var(--border);border-top:3px solid var(--accent);border-radius:var(--radius);box-shadow:var(--shadow-sm);}
  .pad{padding:18px;}
  .btn{border:1px solid #c7d0da;background:#fff;color:var(--text);padding:8px 14px;border-radius:4px;font-size:12.5px;font-weight:600;display:inline-flex;align-items:center;gap:6px;}
  .btn:hover{background:#f4f7fa;border-color:#b7c3d0;}
  .btn:active{transform:translateY(1px);}
  .btn-primary{background:var(--accent);border-color:var(--accent-dark);color:#fff;}
  .btn-primary:hover{background:var(--accent-dark);}
  .btn-danger{background:#fff;border-color:#e6b3b3;color:var(--red);}
  .btn-danger:hover{background:var(--red-bg);}
  .btn-green{background:var(--green);border-color:var(--green);color:#fff;}
  .btn-sm{padding:5px 10px;font-size:11.5px;}
  .btn:disabled{opacity:.45;cursor:not-allowed;}

  .tabbar{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:16px;}
  .tab{padding:7px 13px;border-radius:4px;border:1px solid #c7d0da;background:#fff;font-size:12.5px;font-weight:600;color:var(--muted);}
  .tab.active{background:var(--accent);color:#fff;border-color:var(--accent-dark);}
  .chip{padding:6px 12px;border-radius:4px;border:1px solid #c7d0da;background:#fff;font-size:12px;font-weight:600;color:var(--muted);display:inline-flex;align-items:center;gap:6px;}
  .chip.active{background:var(--accent);color:#fff;border-color:var(--accent-dark);}
  .chip .x{opacity:.6;}

  .badge{font-size:10.5px;font-weight:700;padding:2px 8px;border-radius:3px;letter-spacing:.03em;text-transform:uppercase;display:inline-block;}
  .badge-blue{background:#e2f0f9;color:var(--accent-dark);}
  .badge-green{background:var(--green-bg);color:var(--green);}
  .badge-red{background:var(--red-bg);color:var(--red);}
  .badge-amber{background:var(--amber-bg);color:var(--amber);}
  .badge-gray{background:#eef0f4;color:var(--muted);}

  .label{font-size:10.5px;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);font-weight:700;display:block;margin-bottom:6px;}
  .field{margin-bottom:14px;}
  .field input[type=text],.field input[type=number],.field input[type=date],.field input[type=time],.field select,.field textarea{
    width:100%;padding:9px 11px;border:1px solid #c7d0da;border-radius:4px;background:#fff;color:var(--text);
  }
  .field input:focus,.field select:focus,.field textarea:focus{outline:2px solid #bfe0f2;border-color:var(--accent);}
  .grid2{display:grid;grid-template-columns:1fr 1fr;gap:14px;}
  .jsec{font-size:11px;letter-spacing:.06em;text-transform:uppercase;color:var(--accent-dark);font-weight:700;margin:20px 0 10px;border-top:1px solid var(--border);padding-top:16px;}
  .empty{padding:40px 20px;text-align:center;color:var(--muted);}
  .empty .big{font-size:26px;margin-bottom:8px;}
  .empty b{display:block;color:var(--text);font-size:14px;margin-bottom:4px;}
  .hint{font-size:11.5px;color:var(--muted);margin-top:4px;}

  /* ---------- Modal ---------- */
  #modal-backdrop{position:fixed;inset:0;background:rgba(15,22,40,.5);display:none;align-items:flex-start;justify-content:center;padding:6vh 16px;overflow:auto;z-index:100;}
  #modal-backdrop.show{display:flex;}
  .modal{background:#fff;border-radius:14px;width:480px;max-width:100%;box-shadow:0 25px 60px rgba(0,0,0,.3);max-height:88vh;display:flex;flex-direction:column;}
  .modal.wide{width:560px;}
  .modal-head{padding:16px 20px;border-bottom:1px solid var(--border);display:flex;align-items:center;justify-content:space-between;}
  .modal-head h3{margin:0;font-size:15.5px;}
  .modal-head .sub{font-size:11.5px;color:var(--muted);margin-top:2px;}
  .modal-close{border:none;background:#f2f4f8;width:26px;height:26px;border-radius:6px;color:var(--muted);font-size:14px;}
  .modal-body{padding:20px;overflow-y:auto;}
  .modal-foot{padding:14px 20px;border-top:1px solid var(--border);display:flex;justify-content:flex-end;gap:8px;}

  /* ---------- misc pages ---------- */
  .schema-banner{display:flex;align-items:center;justify-content:space-between;gap:20px;margin-bottom:16px;background:linear-gradient(90deg,#f4f9fc 0%,#fff 100%);}
  .hem-grid3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:16px;margin-bottom:16px;}
  .countdown{font-family:var(--mono);font-size:26px;font-weight:700;color:var(--accent-dark);letter-spacing:.02em;}
  .next-label{font-size:10.5px;color:var(--muted);text-transform:uppercase;letter-spacing:.06em;}
  .next-time{font-size:12.5px;color:var(--text);font-weight:700;}

  .list-row{padding:12px 0;border-bottom:1px solid var(--border);}
  .list-row:last-child{border-bottom:none;}

  .veh-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:14px;}
  .pers-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:14px;}
  .pers-card{border:1px solid var(--border);border-radius:var(--radius);padding:14px;background:#fff;display:flex;flex-direction:column;gap:12px;}
  .pers-card .toprow{display:flex;align-items:flex-start;gap:10px;}
  .pers-card .flex1{flex:1;min-width:0;}
  .pers-card b{display:block;font-size:13px;line-height:1.3;word-break:break-word;}
  .pers-card span{font-size:11.5px;color:var(--muted);}
  .veh-card{border:1px solid var(--border);border-radius:var(--radius);overflow:hidden;background:#fff;}
  .veh-flag{background:var(--amber-bg);color:var(--amber);font-size:10.5px;font-weight:700;letter-spacing:.05em;text-transform:uppercase;padding:6px 14px;}
  .veh-body{padding:14px;}
  .veh-title{display:flex;align-items:center;gap:8px;margin-bottom:8px;}
  .veh-icon{width:26px;height:26px;border-radius:6px;background:#eef1f7;display:flex;align-items:center;justify-content:center;font-weight:700;font-size:12px;color:var(--muted);}
  .kv{display:flex;justify-content:space-between;font-size:12.5px;padding:3px 0;color:var(--muted);}
  .kv b{color:var(--text);font-weight:600;}

  .mod-card{border:1px solid var(--border);border-radius:var(--radius);background:#fff;padding:16px;}
  .mod-tags{display:flex;gap:6px;margin-bottom:10px;}
  .mod-steps{margin:10px 0;display:flex;flex-direction:column;gap:5px;}
  .mod-step{display:flex;align-items:center;gap:8px;font-size:12.5px;}
  .step-num{width:17px;height:17px;border-radius:50%;background:var(--accent);color:#fff;font-size:10px;font-weight:700;display:flex;align-items:center;justify-content:center;flex-shrink:0;}
  .mod-note{background:var(--amber-bg);color:#8a5c11;font-size:12px;padding:8px 10px;border-radius:7px;margin-top:8px;}
  .mod-actions{display:flex;gap:7px;margin-top:12px;flex-wrap:wrap;}

  .notif-panel{position:absolute;top:34px;right:0;width:340px;background:#fff;border:1px solid var(--border);border-radius:10px;box-shadow:0 14px 30px rgba(0,0,0,.15);display:none;z-index:50;}
  .notif-panel.show{display:block;}
  .notif-head{padding:12px 16px;border-bottom:1px solid var(--border);display:flex;justify-content:space-between;align-items:center;font-weight:700;font-size:13px;}
  .notif-head .links{font-size:11px;font-weight:600;display:flex;gap:10px;}
  .notif-item{padding:12px 16px;border-bottom:1px solid var(--border);font-size:12.5px;}
  .notif-item:last-child{border-bottom:none;}
  .notif-item .t{font-weight:700;margin-bottom:3px;}
  .notif-item .d{color:var(--muted);font-size:11px;margin-top:4px;}
  .notif-actions{display:flex;gap:8px;margin-top:8px;}

  .autocomplete{position:relative;}
  .ac-list{position:absolute;left:0;right:0;top:100%;background:#fff;border:1px solid var(--border);border-radius:7px;box-shadow:0 8px 20px rgba(0,0,0,.1);z-index:20;max-height:150px;overflow:auto;}
  .ac-item{padding:8px 11px;font-size:12.5px;cursor:pointer;}
  .ac-item:hover{background:#f2f4f8;}

  .msg-thread{border:1px solid var(--border);border-radius:var(--radius);padding:14px 16px;margin-bottom:10px;background:#fff;}
  .msg-thread .top{display:flex;justify-content:space-between;font-size:12.5px;margin-bottom:5px;}
  .msg-thread .top b{font-size:13px;}
  .msg-thread .meta{color:var(--muted);font-size:11px;}

  .toast{position:fixed;bottom:22px;right:22px;background:var(--navy);color:#fff;padding:11px 18px;border-radius:8px;font-size:12.5px;box-shadow:0 10px 25px rgba(0,0,0,.2);z-index:200;opacity:0;transform:translateY(8px);transition:.2s;}
  .toast.show{opacity:1;transform:translateY(0);}

  .prog-bar{height:6px;border-radius:4px;background:#eef1f7;overflow:hidden;margin:6px 0;}
  .prog-bar > div{height:100%;background:var(--accent);}
  .quiz-progbar{height:6px;border-radius:4px;background:#eef1f7;overflow:hidden;margin:14px 0 18px;}
  .quiz-progbar > div{height:100%;background:var(--accent);}

  ::-webkit-scrollbar{width:9px;height:9px;}
  ::-webkit-scrollbar-thumb{background:#c9cfdb;border-radius:5px;}

  @media (max-width:880px){
    #sidebar{position:fixed;left:-230px;z-index:80;transition:.2s;}
    #sidebar.open{left:0;}
    .hem-grid3{grid-template-columns:1fr;}
  }

  /* ---------- Login screen ---------- */
  #login-screen{
    min-height:100vh;display:none;align-items:center;justify-content:center;
    background:var(--bg);
    padding:24px;
  }
  .login-wrap{display:flex;width:820px;max-width:100%;border-radius:8px;overflow:hidden;box-shadow:var(--shadow-md);border:1px solid var(--border);}
  .login-side{
    flex:1;min-width:0;padding:40px 34px;color:#fff;
    background:var(--accent);
    display:flex;flex-direction:column;justify-content:space-between;
  }
  .login-side .icon{width:52px;height:52px;display:flex;align-items:center;justify-content:center;margin-bottom:20px;}
  .login-side .icon img{width:100%;height:100%;object-fit:contain;}
  .login-side h2{font-size:20px;margin:0 0 8px;letter-spacing:-.005em;font-weight:700;}
  .login-side p{font-size:12.5px;color:rgba(255,255,255,.85);line-height:1.6;margin:0;}
  .login-side .feat{display:flex;align-items:center;gap:9px;font-size:12px;color:rgba(255,255,255,.9);margin-top:12px;}
  .login-side .feat .dotf{width:5px;height:5px;border-radius:50%;background:#fff;flex-shrink:0;}
  .login-card{background:#fff;width:380px;flex-shrink:0;overflow:hidden;}
  .login-brand{display:none;}
  .login-body{padding:36px 32px;}
  .login-body h3{margin:0 0 4px;font-size:18px;letter-spacing:-.005em;color:var(--text);}
  .login-body .sub{font-size:12.5px;color:var(--muted);margin:0 0 22px;}
  .login-toggle{font-size:12px;color:var(--accent);text-align:center;display:block;margin-top:14px;cursor:pointer;font-weight:600;}
  .login-error{background:var(--red-bg);color:var(--red);font-size:12px;padding:9px 11px;border-radius:4px;margin-bottom:14px;border:1px solid #e6b3b3;}
  @media (max-width:720px){ .login-side{display:none;} .login-card{width:380px;} }
</style>
</head>
<body>
<div id="login-screen"></div>
<div id="shell" style="display:none;flex-direction:column;min-height:100vh;">
  <div id="topheader"></div>
  <div id="app">
    <nav id="sidebar"></nav>
    <div id="main">
      <div id="topbar"></div>
      <div id="content"></div>
    </div>
  </div>
</div>
<div id="modal-backdrop"><div class="modal" id="modal-inner"></div></div>
<div class="toast" id="toast"></div>

<script>
/* =====================================================================
   AMBULANSINTRANÄT — fristående simulator
   All data lagras i webbläsarens localStorage. Ingen data skickas någonstans.
===================================================================== */

  return days[dt.getDay()]+' '+dt.toLocaleDateString('sv-SE');

let DB = null;

function migrateDB(){
  // Fyll i fält som saknas om datan sparades med en äldre version av appen
  const defaults = seed();
  Object.keys(defaults).forEach(k=>{ if(DB[k]===undefined || DB[k]===null) DB[k]=defaults[k]; });
  if(!DB.losenord || typeof DB.losenord!=='object') DB.losenord = {};
  if(!Array.isArray(DB.inloggadeKonton)) DB.inloggadeKonton = [];
  if(!Array.isArray(DB.stations) || DB.stations.length===0) DB.stations = defaults.stations;
  DB.personal = DB.personal || [];
  DB.personal.forEach(p=>{
    if(!p.behorigheter) p.behorigheter = {HEMS:false,Akutläkarbil:false,Jourläkarbil:false,Sjukvårdsledning:false,PAM:false,Pilot:false,Utbildare:false};
    if(!Array.isArray(p.utbildningar)) p.utbildningar = [];
  });
  if(!Array.isArray(DB.utbildningModuler)) DB.utbildningModuler = defaults.utbildningModuler;
  if(!Array.isArray(DB.kategorier) || DB.kategorier.length===0) DB.kategorier = defaults.kategorier;
  if(!DB.kontoAdmin || typeof DB.kontoAdmin!=='object') DB.kontoAdmin = {};
  // Säkerhetsnät: om datan migrerades från en äldre version utan adminflaggor,
  // eller om alla adminflaggor av misstag blivit falska, gör alla befintliga
  // konton till admin (bevarar tidigare full åtkomst) istället för att låsa ute alla.
  const harAdmin = DB.inloggadeKonton.some(k=>DB.kontoAdmin[k]===true);
  if(!harAdmin){
    DB.inloggadeKonton.forEach(k=>{ if(DB.kontoAdmin[k]===undefined) DB.kontoAdmin[k] = true; });
    if(!DB.inloggadeKonton.some(k=>DB.kontoAdmin[k]===true) && DB.inloggadeKonton.length){
      DB.kontoAdmin[DB.inloggadeKonton[0]] = true;
    }
  }
}

function loadLocalDB(){
  try{
    const raw = localStorage.getItem(STORE_KEY);
    if(raw){ DB = JSON.parse(raw); }
    else { DB = seed(); }
  }catch(e){ DB = seed(); }
  migrateDB();
}

function saveDB(){
  localStorage.setItem(STORE_KEY, JSON.stringify(DB)); // lokal cache / offline-fallback
  if(cloudEnabled && !applyingRemoteUpdate) scheduleCloudSave();
}
function jsonbinHeaders(extra){
  return Object.assign({ 'Content-Type':'application/json', 'X-Master-Key': JSONBIN_CONFIG.apiKey }, extra||{});
}
function scheduleCloudSave(){
  clearTimeout(cloudSaveTimer);
  cloudSaveTimer = setTimeout(()=>{
    if(!cloudBinId) return;
    const json = JSON.stringify(DB);
    fetch(JSONBIN_BASE+'/'+cloudBinId, {
      method:'PUT',
      headers: jsonbinHeaders(),
      body: json
    }).then(res=>{
      if(!res.ok) throw new Error('HTTP '+res.status);
      lastCloudJson = json;
      setCloudStatus('Molnet anslutet', true);
    }).catch(err=>{
      console.error('Cloud save error:', err);
      setCloudStatus('Kunde inte spara till molnet', false);
      toast('Kunde inte spara till molnet — kontrollera internetanslutning');
    });
  }, 600);
}

function initCloud(callback){
  if(!cloudConfigured()){
    cloudEnabled = false;
    setCloudStatus('Endast lokalt (ingen molnkonfig)', false);
    callback();
    return;
  }
  setCloudStatus('Ansluter till molnet…', false);
  cloudEnabled = true;

  if(JSONBIN_CONFIG.binId){
    // Bin-ID redan ifyllt — hämta senaste delad data
    cloudBinId = JSONBIN_CONFIG.binId;
    fetch(JSONBIN_BASE+'/'+cloudBinId+'/latest', { headers: jsonbinHeaders() })
      .then(res=>{ if(!res.ok) throw new Error('HTTP '+res.status); return res.json(); })
      .then(data=>{
        DB = data.record;
        migrateDB();
        lastCloudJson = JSON.stringify(DB);
        cloudReady = true;
        setCloudStatus('Molnet anslutet', true);
        callback();
        startCloudPolling();
      }).catch(err=>{
        console.error('Kunde inte ansluta till molnet, kör lokalt:', err);
        setCloudStatus('Kunde inte ansluta — kör lokalt', false);
        cloudEnabled = false;
        callback();
      });
  } else {
    // Ingen Bin-ID ifylld — skapa en ny delad molnlagring automatiskt
    fetch(JSONBIN_BASE, {
      method:'POST',
      headers: jsonbinHeaders({ 'X-Bin-Name':'Ambulansintranät delad data' }),
      body: JSON.stringify(DB)
    }).then(res=>{ if(!res.ok) throw new Error('HTTP '+res.status); return res.json(); })
      .then(data=>{
        cloudBinId = data.metadata.id;
        lastCloudJson = JSON.stringify(DB);
        cloudReady = true;
        setCloudStatus('Molnet anslutet (nytt)', true);
        callback();
        startCloudPolling();
        // Visa Bin-ID:t så användaren kan klistra in det i filen permanent
        setTimeout(()=>{
          alert('Molnlagring skapad!\n\nKopiera detta Bin-ID och klistra in det i JSONBIN_CONFIG.binId i filen, spara, och skicka filen till alla som ska dela samma data:\n\n'+cloudBinId);
        }, 400);
      }).catch(err=>{
        console.error('Kunde inte skapa molnlagring, kör lokalt:', err);
        setCloudStatus('Kunde inte ansluta — kör lokalt', false);
        cloudEnabled = false;
        callback();
      });
  }
}
function startCloudPolling(){
  clearInterval(cloudPollTimer);
  cloudPollTimer = setInterval(pollCloud, CLOUD_POLL_MS);
}
function pollCloud(){
  if(!cloudBinId || !cloudEnabled) return;
  fetch(JSONBIN_BASE+'/'+cloudBinId+'/latest', { headers: jsonbinHeaders() })
    .then(res=>{ if(!res.ok) throw new Error('HTTP '+res.status); return res.json(); })
    .then(data=>{
      const json = JSON.stringify(data.record);
      if(json === lastCloudJson) { setCloudStatus('Molnet anslutet', true); return; } // inget nytt
      applyingRemoteUpdate = true;
      DB = data.record;
      migrateDB();
      lastCloudJson = json;
      localStorage.setItem(STORE_KEY, JSON.stringify(DB));
      applyingRemoteUpdate = false;
      setCloudStatus('Molnet anslutet', true);
      // Undvik att störa en pågående dialogruta — uppdatera bara om ingen modal är öppen
      if(document.getElementById('login-screen').style.display!=='flex' && !document.getElementById('modal-backdrop').classList.contains('show')){
        renderSidebar(); renderTopbar(); renderPage();
      }
    }).catch(err=>{
      console.error('Molnsynk-fel:', err);
      setCloudStatus('Molnanslutning tappad', false);
    });
}
function resetDB(){
  const varning = cloudEnabled
    ? 'Återställ ALL data till ursprungsläget för ALLA som använder systemet (molnet är anslutet)? Detta går inte att ångra.'
    : 'Återställ all lokal data till ursprungsläget? Detta går inte att ångra.';

function nextPatrolInfo(){
  const list = DB.utsattningar.filter(u=>u.status!=='Avslutad').slice().sort((a,b)=> (a.datum+a.tid).localeCompare(b.datum+b.tid));
  if(list.length) return {label: dayName(list[0].datum)+' kl. '+list[0].tid, target: new Date(list[0].datum+'T'+list[0].tid+':00')};
  // fall back to schema
  const s = DB.schema;
  if(!s.dagar.length) return {label:'Inget schema satt', target:null};
  const dagMap = {'Sön':0,'Mån':1,'Tis':2,'Ons':3,'Tor':4,'Fre':5,'Lör':6};
  const now = new Date();
  let best=null;
  for(let i=0;i<14;i++){
    const d=new Date(now); d.setDate(d.getDate()+i); d.setHours(s.timme,s.minut,0,0);
    if(d<now) continue;
    const dn = Object.keys(dagMap).find(k=>dagMap[k]===d.getDay());
    if(s.dagar.includes(dn)){ best=d; break; }
  }
  if(!best) return {label:'Inget kommande tillfälle', target:null};
  const days=['Söndag','Måndag','Tisdag','Onsdag','Torsdag','Fredag','Lördag'];
  return {label: days[best.getDay()]+' kl. '+String(s.timme).padStart(2,'0')+':'+String(s.minut).padStart(2,'0'), target: best};
}
function updateCountdown(){
  const el = document.getElementById('countdownEl');
  if(!el) return;
  const info = nextPatrolInfo();
  if(!info.target){ el.textContent = '--:--:--'; return; }
  let diff = Math.max(0, info.target - new Date());
  const h = Math.floor(diff/3600000), m=Math.floor(diff%3600000/60000), s=Math.floor(diff%60000/1000);
  el.textContent = String(h).padStart(2,'0')+':'+String(m).padStart(2,'0')+':'+String(s).padStart(2,'0');
}

/* ================= UTSÄTTNINGAR ================= */
let utsattningFilterStation = 'Alla stationer';
let utsattningVisaAvslutade = false;

function pageUtsattningar(){
  const stations = ['Alla stationer', ...DB.stations];
  let list = DB.utsattningar.filter(u => utsattningVisaAvslutade ? true : u.status!=='Avslutad');
  if(utsattningFilterStation!=='Alla stationer'){
    list = list.filter(u => u.fordon.some(fr => (DB.fordon.find(f=>f.id===fr.fordonId)||{}).station===utsattningFilterStation));
  }
  list = list.slice().sort((a,b)=>(a.datum+a.tid).localeCompare(b.datum+b.tid));

  return `
    <div class="page-head">
      <div><h1 class="page-title">Utsättningar</h1><p class="page-sub">Operativa utsättningar per station</p></div>
      <div style="display:flex;gap:8px;">
        <button class="btn" onclick="utsattningVisaAvslutade=!utsattningVisaAvslutade; renderPage();">${utsattningVisaAvslutade?'Dölj avslutade':'Visa avslutade'}</button>
        <button class="btn btn-primary" onclick="openUtsattningModal()">+ Skapa utsättning</button>
      </div>
    </div>
    <div class="tabbar">
      ${stations.map(s=>`<div class="tab ${utsattningFilterStation===s?'active':''}" onclick="utsattningFilterStation='${s}';renderPage();">${escapeHtml(s)}</div>`).join('')}
    </div>
    ${list.length===0 ? `<div class="card pad"><div class="empty"><div class="big">🚑</div><b>Inga utsättningar</b>Skapa en ny utsättning för att komma igång.</div></div>` : `
    <div style="display:grid;grid-template-columns:repeat(auto-fill,minmax(320px,1fr));gap:14px;">
      ${list.map(u=>utsattningCard(u)).join('')}
    </div>`}
  `;
}
function utsattningCard(u){
  const stCodes = [...new Set(u.fordon.map(fr => (DB.fordon.find(f=>f.id===fr.fordonId)||{}).station).filter(Boolean))];
  const badge = u.status==='Planerad'?'badge-amber':u.status==='Aktiv'?'badge-green':'badge-gray';
  return `
    <div class="card pad">
      <div style="display:flex;justify-content:space-between;align-items:flex-start;margin-bottom:10px;">
        <div><b style="font-size:14.5px;">${escapeHtml(u.namn||dayName(u.datum))}</b><div style="font-size:11.5px;color:var(--muted);">${fmtDate(u.datum)} · ${u.tid}</div></div>
        <div style="display:flex;gap:5px;flex-wrap:wrap;justify-content:flex-end;">${stCodes.map(s=>`<span class="badge badge-blue">${escapeHtml(s)}</span>`).join('')}</div>
      </div>
      ${groupBy(u.fordon, fr=>(DB.fordon.find(f=>f.id===fr.fordonId)||{}).station).map(([station, frs])=>`
        <div style="font-size:10.5px;letter-spacing:.05em;text-transform:uppercase;color:var(--muted);font-weight:700;margin:8px 0 4px;">${escapeHtml(station||'Okänd station')}</div>
        ${frs.map(fr=>{
          const f = DB.fordon.find(x=>x.id===fr.fordonId);
          if(!f) return '';
          return `<div style="display:flex;align-items:center;gap:8px;padding:5px 0;">
            <div class="veh-icon" style="width:20px;height:20px;font-size:10px;">A</div>
            <div style="flex:1;"><span class="badge badge-blue" style="margin-right:6px;">${escapeHtml(f.kod)}</span>${escapeHtml(f.typ)} <span class="badge badge-blue">${escapeHtml(f.kategori)}</span>
            <div style="font-size:11.5px;color:var(--muted);margin-top:3px;">${fr.personal.map(pid=>{const p=DB.personal.find(x=>x.id===pid); return p? escapeHtml(p.namn):'';}).join(', ')||'Ingen personal tillagd'}</div></div>
          </div>`;
        }).join('')}
      `).join('')}
      ${u.anteckningar? `<div style="background:#f7f8fb;border:1px solid var(--border);border-radius:7px;padding:8px 10px;font-size:12.5px;margin-top:8px;">${escapeHtml(u.anteckningar)}</div>`:''}
      <div style="display:flex;justify-content:space-between;align-items:center;margin-top:12px;">
        <span class="badge ${badge}">${escapeHtml(u.status)}</span>
        <div style="display:flex;gap:6px;">
          <button class="btn btn-sm" onclick="cycleUtsattningStatus('${u.id}')">Byt status</button>
          <button class="btn btn-sm" onclick="openUtsattningModal('${u.id}')">Redigera</button>
          <button class="btn btn-danger btn-sm" onclick="delUtsattning('${u.id}')">Ta bort</button>
        </div>
      </div>
    </div>
  `;
}
function groupBy(arr, keyFn){
  const map = new Map();
  arr.forEach(x=>{ const k=keyFn(x); if(!map.has(k)) map.set(k,[]); map.get(k).push(x); });
  return Array.from(map.entries());
}
function cycleUtsattningStatus(id){
  const u = DB.utsattningar.find(x=>x.id===id); if(!u) return;
  const order = ['Planerad','Aktiv','Avslutad'];
  u.status = order[(order.indexOf(u.status)+1)%order.length];
  saveDB(); renderPage();
}
function delUtsattning(id){
  if(!confirm('Ta bort utsättningen?')) return;
  DB.utsattningar = DB.utsattningar.filter(x=>x.id!==id);
  saveDB(); renderPage();
}

function openUtsattningModal(id){
  const editing = id ? DB.utsattningar.find(x=>x.id===id) : null;
  const stationFilter = window.__utsFordonStation || 'Alla stationer';
  openModal(`
    <div class="modal-head"><h3>${editing?'Redigera':'Skapa'} utsättning</h3><button class="modal-close" onclick="closeModal()">✕</button></div>
    <div class="modal-body">
      <div class="grid2">
        <div class="field"><span class="label">Namn / passbeteckning</span><input type="text" id="uNamn" placeholder="ex: Kväll Fredag v.12" value="${editing?escapeHtml(editing.namn):''}"></div>
        <div class="field"><span class="label">Tid</span><input type="time" id="uTid" value="${editing?editing.tid:'19:00'}"></div>
      </div>
      <div class="grid2">
        <div class="field"><span class="label">Datum</span><input type="date" id="uDatum" value="${editing?editing.datum:todayISO()}"></div>

      <div class="tabbar" id="uStationTabs">
        ${['Alla stationer',...DB.stations].map(s=>`<div class="tab ${stationFilter===s?'active':''}" onclick="window.__utsFordonStation='${s}';refreshUtsModal('${id||''}')">${escapeHtml(s)}</div>`).join('')}
      </div>
      <span class="label">Välj fordon — välj från valfri station</span>
      <div class="card" style="margin-bottom:16px;max-height:170px;overflow:auto;" id="uFordonList"></div>
      <span class="label">Personal per fordon</span>
      <div id="uPersonalPerFordon"></div>
    </div>
    <div class="modal-foot"><button class="btn" onclick="closeModal()">Avbryt</button><button class="btn btn-primary" onclick="saveUtsattning('${id||''}')">Spara utsättning</button></div>
  `, true);
  window.__utsSelectedFordon = editing ? editing.fordon.map(f=>f.fordonId) : [];
  window.__utsPersonalMap = editing ? Object.fromEntries(editing.fordon.map(f=>[f.fordonId, f.personal.slice()])) : {};
  renderUtsFordonList();
}
function refreshUtsModal(id){
  const tabs = document.querySelectorAll('#uStationTabs .tab');
  tabs.forEach(t=>t.classList.toggle('active', t.textContent.trim()===window.__utsFordonStation));
  renderUtsFordonList();
}
function renderUtsFordonList(){
  const stationFilter = window.__utsFordonStation || 'Alla stationer';
  const list = DB.fordon.filter(f => stationFilter==='Alla stationer' || f.station===stationFilter);
  document.getElementById('uFordonList').innerHTML = list.map(f=>`
    <label style="display:flex;align-items:center;gap:10px;padding:10px 14px;border-bottom:1px solid var(--border);font-size:12.5px;">
      <input type="checkbox" ${window.__utsSelectedFordon.includes(f.id)?'checked':''} onchange="toggleUtsFordon('${f.id}')">
      <div><b>${escapeHtml(f.typ)} (${escapeHtml(f.regnr)})</b><div style="color:var(--muted);">${escapeHtml(f.kod)} · ${escapeHtml(f.kategori)} · ${escapeHtml(f.station)}</div></div>
    </label>`).join('') || `<div class="empty" style="padding:20px;">Inga fordon på denna station.</div>`;
  renderUtsPersonalPerFordon();
}
function toggleUtsFordon(fid){
  const sel = window.__utsSelectedFordon;
  const idx = sel.indexOf(fid);
  if(idx>-1) sel.splice(idx,1); else sel.push(fid);
  if(!window.__utsPersonalMap[fid]) window.__utsPersonalMap[fid]=[];
  renderUtsPersonalPerFordon();
}
function renderUtsPersonalPerFordon(){
  const el = document.getElementById('uPersonalPerFordon');
  if(!el) return;
  el.innerHTML = window.__utsSelectedFordon.map(fid=>{
    const f = DB.fordon.find(x=>x.id===fid); if(!f) return '';
    const assigned = window.__utsPersonalMap[fid]||[];
    return `<div class="card pad" style="margin-bottom:10px;">
      <div style="display:flex;gap:8px;align-items:center;margin-bottom:8px;">
        <div class="veh-icon">A</div>
        <div><b>${escapeHtml(f.typ)}</b><div style="font-size:11.5px;color:var(--muted);">${escapeHtml(f.kod)} · ${escapeHtml(f.regnr)} · ${escapeHtml(f.station)}</div></div>
      </div>
      <div style="display:flex;gap:8px;">
        <select id="uSel_${fid}" style="flex:1;padding:8px;border:1px solid var(--border);border-radius:7px;">
          <option value="">— Välj personal —</option>
          ${DB.personal.filter(p=>!assigned.includes(p.id)).map(p=>`<option value="${p.id}">${escapeHtml(p.namn)} (${escapeHtml(p.roll)})</option>`).join('')}
        </select>
        <button class="btn btn-primary btn-sm" onclick="addUtsPersonal('${fid}')">+ Lägg till</button>
      </div>
      <div style="margin-top:8px;">
        ${assigned.length===0? `<div class="hint">Ingen personal tillagd</div>` : assigned.map(pid=>{
          const p = DB.personal.find(x=>x.id===pid);
          return `<div style="display:flex;justify-content:space-between;align-items:center;padding:5px 0;font-size:12.5px;">
            <span>${p?escapeHtml(p.namn)+' ('+escapeHtml(p.roll)+')':'Okänd'}</span>
            <span style="cursor:pointer;color:var(--red);" onclick="removeUtsPersonal('${fid}','${pid}')">✕</span>
          </div>`;
        }).join('')}
      </div>
    </div>`;
  }).join('') || `<div class="hint">Välj minst ett fordon ovan.</div>`;
}
function addUtsPersonal(fid){
  const sel = document.getElementById('uSel_'+fid);
  if(!sel.value) return;
  window.__utsPersonalMap[fid] = window.__utsPersonalMap[fid]||[];
  window.__utsPersonalMap[fid].push(sel.value);
  renderUtsPersonalPerFordon();
}
function removeUtsPersonal(fid,pid){
  window.__utsPersonalMap[fid] = (window.__utsPersonalMap[fid]||[]).filter(x=>x!==pid);
  renderUtsPersonalPerFordon();
}
function saveUtsattning(id){
  const namn = document.getElementById('uNamn').value.trim() || dayName(document.getElementById('uDatum').value);
  const tid = document.getElementById('uTid').value || '19:00';
  const datum = document.getElementById('uDatum').value || todayISO();
  const anteckningar = document.getElementById('uAnt').value.trim();
  const fordon = window.__utsSelectedFordon.map(fid=>({fordonId:fid, personal:(window.__utsPersonalMap[fid]||[])}));
  if(id){
    const u = DB.utsattningar.find(x=>x.id===id);
    Object.assign(u,{namn,tid,datum,anteckningar,fordon});
  } else {
    DB.utsattningar.push({id:uid('uts'), namn,tid,datum,anteckningar,fordon,status:'Planerad'});
  }
  saveDB(); closeModal(); renderPage(); toast('Utsättning sparad');
}

function personCard(p){

function delPersonal(id){
  if(!requireAdmin()) return;
  const p = DB.personal.find(x=>x.id===id);
  if(!p) return;
  if(!confirm('Ta bort '+p.namn+'? Personen tas även bort från eventuella utsättningar. Detta går inte att ångra.')) return;
  DB.personal = DB.personal.filter(x=>x.id!==id);
  DB.utsattningar.forEach(u=>{ u.fordon.forEach(fr=>{ fr.personal = fr.personal.filter(pid=>pid!==id); }); });
  if(DB.currentUserId===id) DB.currentUserId = DB.personal[0] ? DB.personal[0].id : null;
  saveDB(); closeModal(); renderPage(); toast('Person borttagen');
}
function openPersonalModal(id){
  if(!requireAdmin()) return;
  const editing = id? DB.personal.find(x=>x.id===id) : null;
  const roles = ['Ambulanssjukvårdare','Sjuksköterska','Spec. Sjuksköterska','Läkare','Pilot','Övrig'];
  const namesForAutocomplete = DB.personal.map(p=>p.namn);
  openModal(`
    <div class="modal-head"><h3>${editing?'Redigera personal':'Lägg till personal'}</h3><button class="modal-close" onclick="closeModal()">✕</button></div>
    <div class="modal-body" id="persModalBody">
      <div class="field autocomplete">
        <span class="label">Fullständigt namn</span>
        <input type="text" id="pNamn" placeholder="Förnamn Efternamn" value="${editing?escapeHtml(editing.namn):''}" oninput="showNameAC(this)" autocomplete="off">
        <div class="ac-list" id="nameAC" style="display:none;"></div>
      </div>
      <div class="field"><span class="label">Yrkesroll</span>
        <select id="pRoll">${roles.map(r=>`<option ${editing&&editing.roll===r?'selected':''}>${r}</option>`).join('')}</select>
      </div>
      <div class="field"><label style="display:flex;align-items:center;gap:8px;font-size:12.5px;"><input type="checkbox" id="pFavorit" ${editing&&editing.favorit?'checked':''}> ⭐ Personal favoritmarkerad</label></div>
      <div class="field"><span class="label">Kopplad inloggning (valfritt)</span>
        <select id="pKonto"><option value="">— Välj konto —</option>${DB.inloggadeKonton.map(k=>`<option ${editing&&editing.kopplatKonto===k?'selected':''}>${k}</option>`).join('')}</select>
        <div class="hint">Koppla personalen till ett inloggningskonto direkt.</div>
      </div>
      <div id="behBlock">${editing? renderBehorigheterBlock(editing) : ''}</div>
    </div>
    <div class="modal-foot" style="justify-content:space-between;">
      ${editing? `<button class="btn btn-danger" onclick="delPersonal('${id}')">Ta bort person</button>` : `<span></span>`}
      <div style="display:flex;gap:8px;">
        <button class="btn" onclick="closeModal()">Avbryt</button>
        <button class="btn btn-primary" onclick="savePersonal('${id||''}')">${editing?'Spara':'Lägg till'}</button>
      </div>
    </div>
  `, true);
  window.__nameACOptions = namesForAutocomplete.concat(['Intranät Ambulans','Corpuls Script']);
}
function showNameAC(input){
  const val = input.value.toLowerCase();
  const box = document.getElementById('nameAC');
  if(!val){ box.style.display='none'; return; }
  const matches = (window.__nameACOptions||[]).filter(n=>n.toLowerCase().includes(val)).slice(0,5);
  if(!matches.length){ box.style.display='none'; return; }
  box.innerHTML = matches.map(m=>`<div class="ac-item" onclick="pickName('${m.replace(/'/g,"\\'")}')">${escapeHtml(m)}</div>`).join('');
  box.style.display='block';
}
function pickName(name){ document.getElementById('pNamn').value=name; document.getElementById('nameAC').style.display='none'; }

function renderBehorigheterBlock(p){
  const tjanster = ['HEMS','Akutläkarbil','Jourläkarbil','Sjukvårdsledning','PAM','Pilot','Utbildare'];
  return `
    <div style="border-top:1px solid var(--border);margin-top:6px;padding-top:16px;">
      <span class="label">Tjänstebehörigheter</span>
      ${tjanster.map(t=>`
        <div style="display:flex;justify-content:space-between;align-items:center;padding:7px 0;">
          <span style="font-size:13px;">${t}</span>
          <div style="display:flex;align-items:center;gap:8px;">
            <span class="badge ${p.behorigheter[t]?'badge-green':'badge-red'}">${p.behorigheter[t]?'Behörig':'Ej behörig'}</span>
            <select onchange="setBehorighet('${p.id}','${t}',this.value)" style="padding:5px 8px;border:1px solid var(--border);border-radius:6px;font-size:12px;">
              <option value="1" ${p.behorigheter[t]?'selected':''}>Behörig</option>
              <option value="0" ${!p.behorigheter[t]?'selected':''}>Ej behörig</option>
            </select>
          </div>
        </div>`).join('')}
    </div>
    <div style="border-top:1px solid var(--border);margin-top:12px;padding-top:16px;display:flex;justify-content:space-between;align-items:center;">
      <span class="label" style="margin:0;">Pågående utbildningar</span>
      <button class="btn btn-sm" onclick="openStartUtbildningModal('${p.id}')">+ Starta utbildning</button>
    </div>
    <div style="margin-top:10px;">
      ${p.utbildningar.length===0? `<div class="hint">Inga pågående utbildningar.</div>` : p.utbildningar.map(u=>{
        const mod = DB.utbildningModuler.find(m=>m.id===u.modulId);
        if(!mod) return '';
        const done = Object.values(u.steg).filter(Boolean).length;
        const pct = mod.steg.length? Math.round(done/mod.steg.length*100):0;
        return `<div style="border:1px solid var(--border);border-radius:8px;margin-bottom:10px;overflow:hidden;">
          <div style="background:var(--navy);color:#fff;padding:8px 12px;display:flex;justify-content:space-between;font-size:12.5px;font-weight:700;">
            <span>${escapeHtml(mod.namn)}</span>
            <span>${done}/${mod.steg.length} (${pct}%) <span onclick="removeUtbildning('${p.id}','${mod.id}')" style="cursor:pointer;background:rgba(255,255,255,.15);padding:2px 8px;border-radius:5px;margin-left:8px;">Ta bort</span></span>
          </div>
          <div style="padding:10px 12px;">
            <div style="font-size:10.5px;letter-spacing:.05em;text-transform:uppercase;color:var(--muted);font-weight:700;margin-bottom:6px;">${escapeHtml(mod.niva)}</div>
            ${mod.steg.map((s,i)=>`
              <div style="display:flex;justify-content:space-between;align-items:center;padding:5px 0;">
                <span style="display:flex;align-items:center;gap:6px;font-size:12.5px;"><span style="width:7px;height:7px;border-radius:50%;background:${u.steg[i]?'var(--green)':'var(--red)'};display:inline-block;"></span>${escapeHtml(s)}</span>
                <div style="display:flex;align-items:center;gap:6px;">
                  <span class="badge ${u.steg[i]?'badge-green':'badge-red'}">${u.steg[i]?'Behörig':'Ej behörig'}</span>
                  <select onchange="setStegStatus('${p.id}','${mod.id}',${i},this.value)" style="padding:4px 6px;border:1px solid var(--border);border-radius:6px;font-size:11.5px;">
                    <option value="1" ${u.steg[i]?'selected':''}>Behörig</option>
                    <option value="0" ${!u.steg[i]?'selected':''}>Ej behörig</option>
                  </select>
                  <button class="btn btn-sm" onclick="openNoteringModal('${p.id}','${mod.id}')">+ Notering</button>
                </div>
              </div>`).join('')}
            ${u.notering? `<div class="mod-note">Notering: ${escapeHtml(u.notering)} <span onclick="clearNotering('${p.id}','${mod.id}')" style="cursor:pointer;text-decoration:underline;margin-left:6px;">Ta bort</span></div>`:''}
          </div>
        </div>`;
      }).join('')}
    </div>
  `;
}
function setBehorighet(pid,t,val){
  const p = DB.personal.find(x=>x.id===pid); p.behorigheter[t] = val==='1'; saveDB();
  refreshPersonModal(pid);
}
function setStegStatus(pid,mid,idx,val){
  const p = DB.personal.find(x=>x.id===pid);
  const u = p.utbildningar.find(x=>x.modulId===mid);
  u.steg[idx] = val==='1'; saveDB(); refreshPersonModal(pid);
}
function openNoteringModal(pid,mid){
  const p = DB.personal.find(x=>x.id===pid);
  const u = p.utbildningar.find(x=>x.modulId===mid);
  const txt = prompt('Skriv notering:', u.notering||'');
  if(txt===null) return;
  u.notering = txt; saveDB(); refreshPersonModal(pid); if(CURRENT_PAGE==='utbildning') renderPage();
}
function clearNotering(pid,mid){
  const p = DB.personal.find(x=>x.id===pid);
  const u = p.utbildningar.find(x=>x.modulId===mid);
  u.notering=''; saveDB(); refreshPersonModal(pid);
}
function removeUtbildning(pid,mid){
  const p = DB.personal.find(x=>x.id===pid);
  p.utbildningar = p.utbildningar.filter(x=>x.modulId!==mid);
  saveDB(); refreshPersonModal(pid);
}
function openStartUtbildningModal(pid){
  const p = DB.personal.find(x=>x.id===pid);
  const available = DB.utbildningModuler.filter(m=>!p.utbildningar.some(u=>u.modulId===m.id));
  if(available.length===0){ toast('Alla moduler redan tillagda'); return; }
  openModal(`
    <div class="modal-head"><h3>Starta utbildning</h3><button class="modal-close" onclick="closeModal()">✕</button></div>
    <div class="modal-body">
      <div class="field"><span class="label">Modul</span>
        <select id="startModId">${available.map(m=>`<option value="${m.id}">${escapeHtml(m.namn)} — ${escapeHtml(m.yrkeskategori)}</option>`).join('')}</select>
      </div>
    </div>
    <div class="modal-foot"><button class="btn" onclick="closeModal()">Avbryt</button><button class="btn btn-primary" onclick="startUtbildning('${pid}')">Starta</button></div>
  `);
}
function startUtbildning(pid){
  const mid = document.getElementById('startModId').value;
  const p = DB.personal.find(x=>x.id===pid);
  const mod = DB.utbildningModuler.find(m=>m.id===mid);
  p.utbildningar.push({modulId:mid, steg:Object.fromEntries(mod.steg.map((_,i)=>[i,false])), provStatus:'none', resultat:null, notering:''});
  saveDB(); closeModal(); openPersonalModal(pid); toast('Utbildning startad');
}
function refreshPersonModal(pid){
  const p = DB.personal.find(x=>x.id===pid);
  const el = document.getElementById('behBlock');
  if(el) el.innerHTML = renderBehorigheterBlock(p);
}

function savePersonal(id){
  const namn = document.getElementById('pNamn').value.trim();
  if(!namn){ toast('Ange namn'); return; }
  const roll = document.getElementById('pRoll').value;
  const favorit = document.getElementById('pFavorit').checked;
  const kopplatKonto = document.getElementById('pKonto').value;
  if(id){
    const p = DB.personal.find(x=>x.id===id);
    Object.assign(p,{namn,roll,favorit,kopplatKonto});
  } else {
    DB.personal.push({id:uid('p'), namn, roll, status:'Aktiv', favorit, kopplatKonto, notering:'',
      behorigheter:{HEMS:false,Akutläkarbil:false,Jourläkarbil:false,Sjukvårdsledning:false,PAM:false,Pilot:false,Utbildare:false}});
  }
  saveDB(); closeModal(); renderPage(); toast('Personal sparad');
}

function showPlatsAC(input){
  const val = input.value.toLowerCase();
  const box = document.getElementById('platsAC');
  if(!val){box.style.display='none';return;}
  const matches = DB.adresser.filter(a=>a.toLowerCase().includes(val));
  if(!matches.length){box.style.display='none';return;}
  box.innerHTML = matches.map(m=>`<div class="ac-item" onclick="document.getElementById('frmPlats').value='${m.replace(/'/g,"\\'")}';document.getElementById('platsAC').style.display='none';">${escapeHtml(m)}</div>`).join('');
  box.style.display='block';
}
function submitFormular(){
  const plats = document.getElementById('frmPlats').value.trim();
  if(plats && !DB.adresser.includes(plats)) DB.adresser.push(plats);
  DB.formular.push({
    id:uid('rap'), typ:'Skade-/Olycksrapport',
    datum:document.getElementById('frmDatum').value, tid:document.getElementById('frmTid').value,
    fordonId:document.getElementById('frmFordon').value, forare:document.getElementById('frmForare').value,
    plats, typAvSkada:document.getElementById('frmTyp').value,
    beskrivning:document.getElementById('frmBeskrivning').value, vittnen:document.getElementById('frmVittnen').value,
    patientOmbord:document.getElementById('frmPatient').checked, personskador:document.getElementById('frmPersonskador').checked,
    polisanmalan:document.getElementById('frmPolis').checked, status:'Inkommen', av: currentUser().namn.split(' ')[0]+'.'+currentUser().namn.split(' ')[1][0]
  });
  saveDB(); window.__formShowNew=null; renderPage(); toast('Rapport inskickad');
}

    b:{historik:g('sbHistorik'), medicinering:g('sbMedicinering'), allergi:g('sbAllergi')},
    a:{bt:g('sbBt'), puls:g('sbPuls'), andning:g('sbAndning'), sat:g('sbSat'), temp:g('sbTemp'), neuro:g('sbNeuro')},
    r:{overlamning:g('sbOverlamning'), plan:g('sbPlan'), utfardat:g('sbUtfardat')},
    av: currentUser().namn
  });
  saveDB(); window.__formShowNew=null; renderPage(); toast('SBAR-rapport inskickad');

function refreshJournalForm(){
  window.__journalInfartSatt = document.getElementById('jInfartSatt') ? document.getElementById('jInfartSatt').value : window.__journalInfartSatt;
  renderPage();
}
function renderInfartValjare(){
  return `
    <div class="field"><span class="label">Vilken typ?</span><select id="jInfartTyp" onchange="window.__journalInfartTyp=this.value; renderPage();">
      <option value="">Välj typ...</option>
      ${Object.keys(INFART_TYPER).map(t=>`<option value="${t}" ${window.__journalInfartTyp===t?'selected':''}>${t}</option>`).join('')}
    </select></div>
    <div id="jInfartDetaljer">${window.__journalInfartTyp ? renderInfartDetaljer(window.__journalInfartTyp) : ''}</div>
  `;
}
function renderInfartDetaljer(typ){
  const conf = INFART_TYPER[typ];
  if(!conf) return '';
  return conf.fields.map(f=>{
    if(f.type==='select'){
      return `<div class="field"><span class="label">${f.label}</span><select id="jInf_${f.key}">${f.options.map(o=>`<option>${o}</option>`).join('')}</select></div>`;
    }
    return `<div class="field"><span class="label">${f.label}</span><input type="text" id="jInf_${f.key}"></div>`;
  }).join('') + `<div class="field"><span class="label">Övrigt, ange (om valt ovan)</span><input type="text" id="jInf_ovrigt"></div>`;
}
function toggleFrakturField(){
  const checked = Array.from(document.querySelectorAll('.jSkada:checked')).some(c=>c.value==='Fraktur');
  document.getElementById('jFrakturWrap').style.display = checked? 'block':'none';
}
function updateGcsSum(){
  const e = +document.getElementById('jGcsE').value.replace('E','');
  const v = +document.getElementById('jGcsV').value.replace('V','');
  const m = +document.getElementById('jGcsM').value.replace('M','');
  document.getElementById('jGcsSum').value = e+v+m;
}
function submitJournal(){
  const g = id=>{ const el=document.getElementById(id); return el? el.value : ''; };
  const checkedVals = cls => Array.from(document.querySelectorAll('.'+cls+':checked')).map(c=>c.value);
  let infart = null;
  if(g('jInfartSatt')==='Ja' && window.__journalInfartTyp){
    const conf = INFART_TYPER[window.__journalInfartTyp];
    infart = { typ: window.__journalInfartTyp, ovrigt:g('jInf_ovrigt') };
    conf.fields.forEach(f=>{ infart[f.key] = g('jInf_'+f.key); });
  }
  DB.journalRapporter.push({
    id:uid('jour'), datum:new Date().toISOString(),
    journalforareAv:g('jFor'), specialenhet:window.__journalSpecial||'Ingen', datumUppdrag:g('jDatum'), ort:g('jOrt'),
    ssk:g('jSSK'), usk:g('jUSK'), lakare:g('jLakare'),
    besattning: window.__journalSpecial==='Helikopter/Dimbil' ? {pilot:g('jPilot'), coPilot:g('jCoPilot'), anestSsk:g('jAnestSSK'), narkoslakare:g('jNarkoslakare')} : null,
    fordonId:g('jRakel'),
    larm:{tidMottaget:g('jTidLarm'), tidAnkomst:g('jTidAnkomst'), tidAvfard:g('jTidAvfard'), larmId:g('jLarmId')},
    patient:{pnr:g('jPnr'), alder:g('jAlder'), kon:g('jKon'), position:g('jPosition'), retts:g('jRetts'), symtom:g('jSymtom'), debut:g('jDebut')},
    gcs:{e:g('jGcsE'), v:g('jGcsV'), m:g('jGcsM'), sum:g('jGcsSum')}, rls:g('jRls'),
    vitalt:{af:g('jAf'), sat:g('jSat'), puls:g('jPuls'), temp:g('jTemp'), btSys:g('jBtSys'), btDia:g('jBtDia'), glukos:g('jGlukos')},
    smarta:{nrs:g('jNrs'), lokalisation:g('jSmartLok'), typ:g('jSmartTyp')},
    skador: checkedVals('jSkada'), frakturLokalisation:g('jFrakturLok'),
    infart,
    atgarder: checkedVals('jAtgard'), lakemedel: checkedVals('jLakemedel'), dosEffekt:g('jDosEffekt'),
    transportTill:g('jTransportTill'), transportPrio:g('jTransportPrio'), overrapportering:g('jOverrapp'), avvikelser:g('jAvvikelser'),
    av: currentUser().namn
  });
  saveDB();
  window.__formShowNew=null; window.__journalInfartTyp=''; window.__journalInfartSatt=''; window.__journalSpecial='Ingen';
  renderPage(); toast('Journal inskickad');
}

/* ================= FORDON ================= */
let fordonFilter = 'Alla stationer';
function pageFordon(){
  const filters = ['Alla stationer','På verkstad',...DB.stations];
  let list = DB.fordon;
  if(fordonFilter==='På verkstad') list = list.filter(f=>f.status==='Verkstad');
  else if(fordonFilter!=='Alla stationer') list = list.filter(f=>f.station===fordonFilter);
  return `
    <div class="page-head">
      <div><h1 class="page-title">Fordon</h1><p class="page-sub">Eget fordonsregister</p></div>
      <div style="display:flex;gap:8px;">
        ${isAdmin()? `<button class="btn btn-primary" onclick="openFordonModal()">+ Lägg till fordon</button>` : ''}
        <button class="btn" onclick="renderPage();toast('Uppdaterat')">Uppdatera</button>
      </div>
    </div>
    <div class="tabbar">${filters.map(s=>`<div class="tab ${fordonFilter===s?'active':''}" onclick="fordonFilter='${s}';renderPage();">${escapeHtml(s)}</div>`).join('')}</div>
    <div class="veh-grid">
      ${list.map(f=>`
        <div class="veh-card">
          ${f.status==='Verkstad'? `<div class="veh-flag">På verkstad · Åter ${f.ater||'—'}</div>`:''}
          <div class="veh-body">
            <div class="veh-title"><div class="veh-icon">A</div><b>${escapeHtml(f.typ)}</b> <span class="badge badge-blue">${escapeHtml(f.kategori)}</span></div>
            <div class="kv"><span>Reg.nr</span><b>${escapeHtml(f.regnr)}</b></div>
            <div class="kv"><span>Station</span><b>${escapeHtml(f.status==='Verkstad'?'På verkstad':f.station)}</b></div>
            ${f.status==='Verkstad'? `<div class="kv"><span>Åter</span><b>${f.ater||'—'}</b></div>`:''}
            <div class="kv"><span>Status</span><b>${escapeHtml(f.status==='Verkstad'?'Verkstad':f.status)}</b></div>
            ${isAdmin()? `<div style="display:flex;gap:6px;margin-top:10px;">
              <button class="btn btn-sm" onclick="openFordonModal('${f.id}')">Redigera</button>
              <button class="btn btn-danger btn-sm" onclick="delFordon('${f.id}')">Ta bort</button>
            </div>` : ''}
          </div>
        </div>`).join('') || `<div class="empty">Inga fordon matchar filtret.</div>`}
    </div>
  `;
}
function openFordonModal(id){
  if(!requireAdmin()) return;
  const editing = id? DB.fordon.find(x=>x.id===id):null;
  openModal(`
    <div class="modal-head"><h3>${editing?'Redigera fordon':'Lägg till fordon'}</h3><button class="modal-close" onclick="closeModal()">✕</button></div>
    <div class="modal-body">
      <div class="grid2">
        <div class="field"><span class="label">Fordonstyp</span><input type="text" id="vTyp" placeholder="ex: Mercedes Sprinter" value="${editing?escapeHtml(editing.typ):''}"></div>
        <div class="field"><span class="label">Stationskod</span><input type="text" id="vKod" placeholder="ex: 331-9110" value="${editing?escapeHtml(editing.kod):''}"></div>
      </div>
      <div class="grid2">
        <div class="field"><span class="label">Reg.nr</span><input type="text" id="vReg" value="${editing?escapeHtml(editing.regnr):''}"></div>
        <div class="field"><span class="label">Kategori</span><input type="text" id="vKat" value="${editing?escapeHtml(editing.kategori):'Ambulans'}"></div>
      </div>
      <div class="grid2">
        <div class="field"><span class="label">Station</span>
          <select id="vStation">${DB.stations.map(s=>`<option ${editing&&editing.station===s?'selected':''}>${s}</option>`).join('')}</select>
        </div>
        <div class="field"><span class="label">Status</span>
          <select id="vStatus" onchange="document.getElementById('vAterWrap').style.display=this.value==='Verkstad'?'block':'none';">
            ${['Ledig','Upptagen','Verkstad'].map(s=>`<option ${editing&&editing.status===s?'selected':''}>${s}</option>`).join('')}
          </select>
        </div>
      </div>
      <div class="field" id="vAterWrap" style="display:${editing&&editing.status==='Verkstad'?'block':'none'};">
        <span class="label">Åter (datum)</span><input type="date" id="vAter" value="${editing&&editing.ater?editing.ater:''}">
      </div>
    </div>
    <div class="modal-foot"><button class="btn" onclick="closeModal()">Avbryt</button><button class="btn btn-primary" onclick="saveFordon('${id||''}')">Spara</button></div>
  `);
}
function saveFordon(id){
  const data = {
    typ:document.getElementById('vTyp').value.trim(), kod:document.getElementById('vKod').value.trim(),
    regnr:document.getElementById('vReg').value.trim(), kategori:document.getElementById('vKat').value.trim(),
    station:document.getElementById('vStation').value, status:document.getElementById('vStatus').value,
    ater:document.getElementById('vAter').value||null
  };
  if(id) Object.assign(DB.fordon.find(x=>x.id===id), data);
  else DB.fordon.push({id:uid('f'), ...data});
  saveDB(); closeModal(); renderPage(); toast('Fordon sparat');
}
function delFordon(id){ if(!requireAdmin()) return; if(!confirm('Ta bort fordonet?'))return; DB.fordon=DB.fordon.filter(x=>x.id!==id); saveDB(); renderPage(); }

function openStationModal(existing){
  if(!requireAdmin()) return;
  openModal(`
    <div class="modal-head"><h3>${existing?'Byt namn på station':'Lägg till station'}</h3><button class="modal-close" onclick="closeModal()">✕</button></div>
    <div class="modal-body">
      <div class="field"><span class="label">Stationsnamn</span><input type="text" id="stNamn" placeholder="ex: Station Nord" value="${existing?escapeHtml(existing):''}"></div>
    </div>
    <div class="modal-foot"><button class="btn" onclick="closeModal()">Avbryt</button><button class="btn btn-primary" onclick="saveStation(${existing?`'${existing.replace(/'/g,"\\'")}'`:'null'})">Spara</button></div>
  `);
}
function saveStation(existing){
  const namn = document.getElementById('stNamn').value.trim();
  if(!namn){ toast('Ange ett stationsnamn'); return; }
  if(existing){
    if(namn!==existing && DB.stations.includes(namn)){ toast('Stationen finns redan'); return; }
    const idx = DB.stations.indexOf(existing);
    if(idx>-1) DB.stations[idx] = namn;
    DB.fordon.forEach(f=>{ if(f.station===existing) f.station = namn; });
  } else {
    if(DB.stations.includes(namn)){ toast('Stationen finns redan'); return; }
    DB.stations.push(namn);
  }
  saveDB(); closeModal(); renderPage(); toast('Station sparad');
}
function delStation(namn){
  const antalFordon = DB.fordon.filter(f=>f.station===namn).length;
  if(antalFordon>0){ toast('Kan inte ta bort — '+antalFordon+' fordon är kopplade till stationen'); return; }
  if(!confirm('Ta bort stationen "'+namn+'"?')) return;
  DB.stations = DB.stations.filter(s=>s!==namn);
  saveDB(); renderPage();
}

function requestExam(mid){
  const me = currentUser();
  let prog = me.utbildningar.find(u=>u.modulId===mid);
  if(!prog){ prog = {modulId:mid, steg:{}, provStatus:'none', resultat:null, notering:''}; me.utbildningar.push(prog); }
  prog.provStatus = 'vantande';
  const m = DB.utbildningModuler.find(x=>x.id===mid);
  DB.notiser.push({id:uid('n'), typ:'provfraga', titel:'Provförfrågan: '+m.namn,
    text:me.namn+' vill göra provet "'+m.namn+'". Godkänn eller neka nedan.',
    datum:new Date().toISOString(), lest:false, modulId:mid, personId:me.id, status:'ny'});
  saveDB(); renderPage(); renderTopbar(); toast('Förfrågan skickad till admin');
}
function openTaProv(mid){
  window.__quizState = {mid, idx:0, svar:{}};
  renderQuizModal();
}
function renderQuizModal(){
  const {mid, idx} = window.__quizState;
  const m = DB.utbildningModuler.find(x=>x.id===mid);
  const q = m.prov.fragor[idx];
  const total = m.prov.fragor.length;
  if(!q){ return finishQuiz(); }
  let answerHtml = '';
  if(q.typ==='Flerval'){
    answerHtml = Object.entries(q.alt).filter(([k,v])=>v).map(([k,v])=>`
      <label style="display:flex;gap:8px;align-items:center;padding:9px 12px;border:1px solid var(--border);border-radius:7px;margin-bottom:7px;cursor:pointer;">
        <input type="radio" name="quizAns" value="${k}" ${window.__quizState.svar[q.id]===k?'checked':''} onchange="window.__quizState.svar['${q.id}']='${k}'"><b>${k}</b> ${escapeHtml(v)}
      </label>`).join('');
  } else if(q.typ==='Sant/Falskt'){
    answerHtml = ['Sant','Falskt'].map(v=>`
      <label style="display:flex;gap:8px;align-items:center;padding:9px 12px;border:1px solid var(--border);border-radius:7px;margin-bottom:7px;cursor:pointer;">
        <input type="radio" name="quizAns" value="${v}" ${window.__quizState.svar[q.id]===v?'checked':''} onchange="window.__quizState.svar['${q.id}']='${v}'"> ${v}
      </label>`).join('');
  } else {
    answerHtml = `<textarea rows="4" placeholder="Skriv ditt svar här..." oninput="window.__quizState.svar['${q.id}']=this.value">${window.__quizState.svar[q.id]||''}</textarea>
      <div class="hint">Fritext — rättas manuellt av utbildare.</div>`;
  }
  openModal(`
    <div class="modal-head"><h3>${escapeHtml(m.namn)}</h3><button class="modal-close" onclick="closeModal()">✕</button></div>
    <div class="modal-body">
      <div style="display:flex;justify-content:space-between;font-size:12px;color:var(--muted);"><span>Fråga ${idx+1} av ${total}</span><span>${q.poang} poäng</span></div>
      <div class="quiz-progbar"><div style="width:${((idx+1)/total*100).toFixed(0)}%"></div></div>
      <b style="display:block;margin-bottom:12px;">${escapeHtml(q.text)}</b>
      ${answerHtml}
    </div>
    <div class="modal-foot">
      <button class="btn" ${idx===0?'disabled':''} onclick="window.__quizState.idx--;renderQuizModal();">← Föregående</button>
      ${idx<total-1? `<button class="btn btn-primary" onclick="window.__quizState.idx++;renderQuizModal();">Nästa →</button>`
        : `<button class="btn btn-green" onclick="finishQuiz();">Lämna in ✓</button>`}
    </div>
  `);
}
function finishQuiz(){
  const {mid, svar} = window.__quizState;
  const m = DB.utbildningModuler.find(x=>x.id===mid);
  let poang=0, maxPoang=0, hasFritext=false;
  m.prov.fragor.forEach(q=>{
    maxPoang += q.poang;
    if(q.typ==='Fritext'){ hasFritext=true; return; }
    if(svar[q.id]===q.ratt) poang += q.poang;
  });
  const pct = maxPoang? Math.round(poang/maxPoang*100):0;
  const godkand = pct >= m.prov.godkantGrans;
  const me = currentUser();
  const prog = me.utbildningar.find(u=>u.modulId===mid);
  prog.resultat = {poang, maxPoang, pct, godkand, hasFritext, datum:new Date().toISOString()};
  prog.provStatus = 'genomfort';
  const lastStepIdx = m.steg.length-1;
  if(godkand && !hasFritext) prog.steg[lastStepIdx] = true;
  saveDB();
  closeModal();
  renderPage();
  toast(hasFritext? 'Prov inlämnat — väntar på manuell rättning' : (godkand? `Godkänt! ${pct}%` : `Ej godkänt (${pct}%)`));
}

/* ================= ADMIN: ANVÄNDARE ================= */
function pageAnvandare(){
  if(!isAdmin()) return pageAccessDenied();
  return `
    <div class="page-head"><div><h1 class="page-title">Användare</h1><p class="page-sub">Inloggningskonton, kopplad personal och adminbehörighet</p></div>
      <button class="btn btn-primary" onclick="addAnvandare()">+ Nytt konto</button>
    </div>
    <div class="card pad">
      ${DB.inloggadeKonton.map(k=>{
        const p = DB.personal.find(x=>x.kopplatKonto===k);
        const admin = !!DB.kontoAdmin[k];
        const ensamAdmin = admin && DB.inloggadeKonton.filter(x=>DB.kontoAdmin[x]).length===1;
        return `<div class="list-row" style="display:flex;justify-content:space-between;align-items:center;">
          <div><b>${escapeHtml(k)}</b> ${admin?'<span class="badge badge-blue" style="margin-left:6px;">Admin</span>':''}<div style="font-size:11.5px;color:var(--muted);">${p?'Kopplad till '+escapeHtml(p.namn):'Ej kopplad till personal'}</div></div>
          <div style="display:flex;gap:6px;">
            <button class="btn btn-sm" onclick="toggleKontoAdmin('${k}')" ${ensamAdmin?'disabled title="Minst ett konto måste vara admin"':''}>${admin?'Ta bort admin':'Gör till admin'}</button>
            <button class="btn btn-danger btn-sm" onclick="delAnvandare('${k}')">Ta bort</button>
          </div>
        </div>`;
      }).join('') || `<div class="empty">Inga konton.</div>`}
    </div>
  `;
}
function toggleKontoAdmin(k){
  const nu = !!DB.kontoAdmin[k];
  if(nu){
    const antalAdmin = DB.inloggadeKonton.filter(x=>DB.kontoAdmin[x]).length;
    if(antalAdmin<=1){ toast('Minst ett konto måste ha adminbehörighet'); return; }
  }
  DB.kontoAdmin[k] = !nu;
  saveDB(); renderPage(); toast(nu? 'Adminbehörighet borttagen' : 'Adminbehörighet tillagd');
}
function addAnvandare(){
  const namn = prompt('Kontonamn (ex: förnamn.efternamn):'); if(!namn) return;
  if(DB.inloggadeKonton.includes(namn)){ toast('Kontot finns redan'); return; }
  const pass = prompt('Lösenord för kontot (kan lämnas tomt):','') || '';
  const admin = confirm('Ska kontot ha adminbehörighet?');
  DB.inloggadeKonton.push(namn); DB.losenord[namn] = pass; DB.kontoAdmin[namn] = admin;
  saveDB(); renderPage(); toast('Konto skapat');
}
function delAnvandare(k){
  if(DB.kontoAdmin[k]){
    const antalAdmin = DB.inloggadeKonton.filter(x=>DB.kontoAdmin[x]).length;
    if(antalAdmin<=1){ toast('Kan inte ta bort det enda adminkontot'); return; }
  }
  if(!confirm('Ta bort kontot '+k+'?')) return;
  DB.inloggadeKonton = DB.inloggadeKonton.filter(x=>x!==k);
  delete DB.losenord[k];
  delete DB.kontoAdmin[k];
  DB.personal.forEach(p=>{ if(p.kopplatKonto===k) p.kopplatKonto=''; });
  saveDB(); renderPage();
}

      <div class="kv"><span>Personnummer / Ålder</span><b>${escapeHtml(f.patient.pnr)||escapeHtml(f.patient.alder)||'—'}</b></div>
      <div class="kv"><span>Kön / Position</span><b>${escapeHtml(f.patient.kon)} · ${escapeHtml(f.patient.position)}</b></div>
      <div class="kv"><span>RETTS-prioritet</span><b>${escapeHtml(f.patient.retts)}</b></div>
      <div class="kv"><span>Symtom / Debut</span><b>${escapeHtml(f.patient.symtom)||'—'} / ${escapeHtml(f.patient.debut)||'—'}</b></div>
      <div class="jsec">GCS / RLS</div>
      <div class="kv"><span>GCS (E/V/M)</span><b>${escapeHtml(f.gcs.e)}/${escapeHtml(f.gcs.v)}/${escapeHtml(f.gcs.m)} = ${escapeHtml(f.gcs.sum)}</b></div>
      <div class="kv"><span>RLS</span><b>${escapeHtml(f.rls)}</b></div>
      <div class="jsec">Vitalparametrar</div>
      <div class="kv"><span>Andning / SAT / Puls</span><b>${escapeHtml(f.vitalt.af)||'—'} / ${escapeHtml(f.vitalt.sat)||'—'} / ${escapeHtml(f.vitalt.puls)||'—'}</b></div>
      <div class="kv"><span>Blodtryck</span><b>${escapeHtml(f.vitalt.btSys)||'—'}/${escapeHtml(f.vitalt.btDia)||'—'}</b></div>
      <div class="kv"><span>Temp / Blodsocker</span><b>${escapeHtml(f.vitalt.temp)||'—'} / ${escapeHtml(f.vitalt.glukos)||'—'}</b></div>
      <div class="jsec">Smärta</div>
      <div class="kv"><span>NRS / Typ / Lokalisation</span><b>${escapeHtml(f.smarta.nrs)||'—'} · ${escapeHtml(f.smarta.typ)||'—'} · ${escapeHtml(f.smarta.lokalisation)||'—'}</b></div>
      <div class="jsec">Skador & åtgärder</div>
      <div class="kv"><span>Skador</span><b>${f.skador&&f.skador.length?escapeHtml(f.skador.join(', ')):'Inga angivna'}</b></div>
      ${f.frakturLokalisation? `<div class="kv"><span>Frakturlokalisation</span><b>${escapeHtml(f.frakturLokalisation)}</b></div>`:''}
      <div class="kv"><span>Infart</span><b>${f.infart? escapeHtml(f.infart.typ)+' — '+Object.entries(f.infart).filter(([k])=>k!=='typ').map(([k,v])=>v?k+': '+v:'').filter(Boolean).join(', ') : 'Ej satt'}</b></div>
      <div class="kv"><span>Åtgärder</span><b>${f.atgarder&&f.atgarder.length?escapeHtml(f.atgarder.join(', ')):'Inga angivna'}</b></div>
      <div class="kv"><span>Läkemedel</span><b>${f.lakemedel&&f.lakemedel.length?escapeHtml(f.lakemedel.join(', ')):'Inga angivna'}</b></div>
      <div style="margin:10px 0;padding:10px;background:#f7f8fb;border-radius:7px;font-size:12.5px;">${escapeHtml(f.dosEffekt)||'Ingen kommentar om dos/effekt'}</div>
      <div class="jsec">Transport</div>
      <div class="kv"><span>Transporterad till</span><b>${escapeHtml(f.transportTill)||'—'}</b></div>
      <div class="kv"><span>Prioritet</span><b>${escapeHtml(f.transportPrio)||'—'}</b></div>
      <div style="margin:10px 0;padding:10px;background:#f7f8fb;border-radius:7px;font-size:12.5px;"><b>Överrapportering:</b> ${escapeHtml(f.overrapportering)||'—'}</div>
      <div style="margin:10px 0;padding:10px;background:#f7f8fb;border-radius:7px;font-size:12.5px;"><b>Avvikelser:</b> ${escapeHtml(f.avvikelser)||'—'}</div>
    </div>
    <div class="modal-foot"><button class="btn" onclick="closeModal()">Stäng</button></div>
  `, true);
}
function delJournal(id){ if(!confirm('Ta bort journalen?'))return; DB.journalRapporter = DB.journalRapporter.filter(x=>x.id!==id); saveDB(); renderPage(); }

/* ================= INLOGGNING ================= */
const SESSION_KEY = 'ambulansintranat_session_v1';
let SESSION = {konto:null};
let loginMode = 'valj'; // 'valj' | 'nytt'
let loginSelected = null;
let loginError = '';

function loadSession(){
  try{
    const raw = sessionStorage.getItem(SESSION_KEY);
    SESSION = raw ? JSON.parse(raw) : {konto:null};
  }catch(e){ SESSION = {konto:null}; }
}
function saveSession(){ sessionStorage.setItem(SESSION_KEY, JSON.stringify(SESSION)); }

function initApp(){
  loadLocalDB(); // snabb lokal start (fungerar även offline)
  loadSession();
  initCloud(()=>{
    if(SESSION.konto && DB.inloggadeKonton.includes(SESSION.konto)){
      afterLogin();
    } else {
      showLogin();
    }
  });
}

function showLogin(){
  document.getElementById('shell').style.display = 'none';
  const ls = document.getElementById('login-screen');
  ls.style.display = 'flex';
  loginMode = 'valj'; loginSelected = null; loginError = '';
  renderLoginScreen();
}
function renderLoginScreen(){
  const ls = document.getElementById('login-screen');
  ls.innerHTML = `
    <div>
      <div class="login-wrap">
        <div class="login-side">
          <div>
            <div class="icon"><img src="${LOGO_STAR}" alt="Star of Life" style="width:100%;height:100%;object-fit:contain;"></div>
            <h2>Ambulansintranät</h2>
            <p>Ett samlat verktyg för utsättningar, personal, fordon, formulär och kompetens — delat mellan alla på stationen.</p>
            <div class="feat"><span class="dotf"></span> Realtidsdelad data mellan datorer</div>
            <div class="feat"><span class="dotf"></span> Utsättningar, personal &amp; fordon</div>
            <div class="feat"><span class="dotf"></span> Formulär, SBAR &amp; journalföring</div>
            <div class="feat"><span class="dotf"></span> Utbildning &amp; kompetenskontroll</div>
          </div>
          <img src="${LOGO_VGR}" alt="Region Västra Götaland" style="max-width:100%;height:auto;filter:brightness(0) invert(1);opacity:.85;">
        </div>
        <div class="login-card">
          <div class="login-body">
            <h3>Välkommen tillbaka</h3>
            <p class="sub">Logga in med ditt användarnamn och lösenord</p>
            ${loginError? `<div class="login-error">${escapeHtml(loginError)}</div>`:''}
            ${loginMode==='valj' ? `
              <div class="field"><span class="label">Användarnamn</span><input type="text" id="loginUser" placeholder="förnamn.efternamn" autocomplete="username" onkeydown="if(event.key==='Enter') document.getElementById('loginPass').focus();"></div>
              <div class="field"><span class="label">Lösenord</span><input type="password" id="loginPass" placeholder="••••••" autocomplete="current-password" onkeydown="if(event.key==='Enter') doLogin();"></div>
              <button class="btn btn-primary" style="width:100%;justify-content:center;" onclick="doLogin()">Logga in</button>
              <span class="login-toggle" onclick="loginMode='nytt';loginError='';renderLoginScreen();">+ Skapa nytt konto</span>
            ` : `
              <span class="label">Kontonamn</span>
              <div class="field"><input type="text" id="newKontoNamn" placeholder="ex: förnamn.efternamn"></div>
              <span class="label">Lösenord</span>
              <div class="field"><input type="password" id="newKontoLosen" placeholder="Välj ett lösenord"></div>
              <span class="label">Koppla till personal (valfritt)</span>
              <div class="field">
                <select id="newKontoPerson">
                  <option value="">— Inte kopplat —</option>
                  ${DB.personal.filter(p=>!p.kopplatKonto).map(p=>`<option value="${p.id}">${escapeHtml(p.namn)}</option>`).join('')}
                </select>
              </div>
              <button class="btn btn-primary" style="width:100%;justify-content:center;" onclick="doCreateAccount()">Skapa konto och logga in</button>
              <span class="login-toggle" onclick="loginMode='valj';loginError='';renderLoginScreen();">← Tillbaka</span>
            `}
          </div>
        </div>
      </div>
      <div style="text-align:center;margin-top:16px;">
        <a href="#" onclick="if(confirm('Rensa all sparad data och börja om från grunden? Detta går inte att ångra.')){resetAllData();} return false;" style="color:rgba(255,255,255,.5);font-size:11px;text-decoration:underline;">Problem att logga in? Rensa data och börja om</a>
      </div>
    </div>
  `;
}
function resetAllData(){
  localStorage.removeItem(STORE_KEY);
  sessionStorage.removeItem(SESSION_KEY);
  SESSION = {konto:null};
  if(cloudEnabled && cloudBinId){
    fetch(JSONBIN_BASE+'/'+cloudBinId+'/latest', { headers: jsonbinHeaders() })
      .then(res=>{ if(!res.ok) throw new Error('HTTP '+res.status); return res.json(); })
      .then(data=>{ DB = data.record; migrateDB(); lastCloudJson = JSON.stringify(DB); showLogin(); })
      .catch(()=>{ loadLocalDB(); showLogin(); });
  } else {
    loadLocalDB();
    showLogin();
  }
  toast('Lokal inloggningsdata rensad');
}
function doLogin(){
  const user = ((document.getElementById('loginUser')||{}).value||'').trim();
  const pass = (document.getElementById('loginPass')||{}).value || '';
  if(!user){ loginError='Ange användarnamn.'; renderLoginScreen(); return; }
  if(!DB.inloggadeKonton.includes(user)){ loginError='Fel användarnamn eller lösenord.'; renderLoginScreen(); return; }
  const correct = (DB.losenord||{})[user];
  if(correct!==undefined && correct!=='' && pass!==correct){ loginError='Fel användarnamn eller lösenord.'; renderLoginScreen(); return; }
  SESSION = {konto:user}; saveSession();
  afterLogin();
}
function doCreateAccount(){
  const namn = (document.getElementById('newKontoNamn').value||'').trim();
  const pass = document.getElementById('newKontoLosen').value||'';
  const personId = document.getElementById('newKontoPerson').value;
  if(!namn){ loginError='Ange ett kontonamn.'; renderLoginScreen(); return; }
  if(DB.inloggadeKonton.includes(namn)){ loginError='Kontot finns redan.'; renderLoginScreen(); return; }
  const blirForstaKonto = DB.inloggadeKonton.length===0;
  DB.inloggadeKonton.push(namn);
  DB.losenord[namn] = pass;
  DB.kontoAdmin[namn] = blirForstaKonto; // första kontot som någonsin skapas blir automatiskt admin
  if(personId){ const p = DB.personal.find(x=>x.id===personId); if(p) p.kopplatKonto = namn; }
  saveDB();
  SESSION = {konto:namn}; saveSession();
  afterLogin();
}
function afterLogin(){
  document.getElementById('login-screen').style.display = 'none';
  document.getElementById('shell').style.display = 'flex';
  const p = DB.personal.find(x=>x.kopplatKonto===SESSION.konto);
  DB.currentUserId = p ? p.id : (DB.personal[0] ? DB.personal[0].id : null);
  saveDB();
  route('hem');
}
function logout(){
  SESSION = {konto:null}; saveSession();
  showLogin();
}

/* ================= INIT ================= */
initApp();
</script>
